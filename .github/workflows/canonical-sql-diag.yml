name: Canonical database — read-only SQL diagnostic

# Ferramenta de diagnóstico: roda UMA instrução SELECT/WITH/EXPLAIN/SHOW
# contra o banco canônico dentro de uma transação READ ONLY com ROLLBACK.
# Uso: Actions → "Canonical database — read-only SQL diagnostic" → Run,
# preencher confirm_project_ref (frjbfeamybqsejlvmqbl) e a consulta.
# Sem escrita possível: o runner valida a instrução e o banco rejeita
# qualquer DML/DDL dentro da transação somente-leitura.

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Digite o project ref canônico para evitar alvo acidental
        required: true
        type: string
      query:
        description: Consulta SQL (somente SELECT/WITH/EXPLAIN/SHOW)
        required: true
        type: string
      allow_pii:
        description: >
          W27 — marcar true para consultas que acessam tabelas com dados pessoais
          (schema public). O resultado NÃO aparecerá nos logs: será enviado como
          artifact com retenção de 1 dia. Atenção: em repositório público,
          qualquer usuário autenticado no GitHub pode baixar o artifact durante
          o período de retenção (Codex P1). O banco canônico usa apenas dados
          sintéticos/mock — sem PII real.
        required: false
        default: false
        type: boolean

concurrency:
  group: canonical-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sql-diag:
    name: diagnóstico SQL read-only no canônico
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      # W27: upload-artifact requer actions:write quando allow_pii=true (resultado isolado)
      # Definido no job (não no workflow) para satisfazer Scorecard Token-Permissions
      actions: write
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CANONICAL_REF: frjbfeamybqsejlvmqbl
      CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
      DIAG_QUERY: ${{ inputs.query }}
      # W27: '1' ativa modo PII → resultado em artifact, não em log de CI
      ALLOW_PII: ${{ inputs.allow_pii == true && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validar confirmação e URL sem revelar segredo
        run: |
          set -euo pipefail
          test "$CONFIRM_PROJECT_REF" = "$CANONICAL_REF" || {
            echo '::error::Project ref de confirmação não corresponde ao canônico.'
            exit 1
          }
          test -n "$SUPABASE_DB_URL" || {
            echo '::error::SUPABASE_DB_URL ausente.'
            exit 1
          }
          node scripts/validate-canonical-db-url.mjs

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 # W41: versão major fixa

      - name: Instalar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Executar consulta read-only (ROLLBACK garantido)
        run: |
          set -eo pipefail
          if [ "$ALLOW_PII" = "1" ]; then
            # W27: query acessa schema public → resultado isolado em arquivo, nunca impresso no log.
            DIAG_OUTPUT_FILE="$(mktemp /tmp/sql-diag-XXXXXX.txt)"
            export DIAG_OUTPUT_FILE
            # Codex P2: registrar o caminho ANTES de chamar o Node — set -e encerraria
            # o step em falha antes que o echo chegasse a rodar, impedindo o upload.
            echo "DIAG_OUTPUT_FILE=$DIAG_OUTPUT_FILE" >> "$GITHUB_ENV"
            node scripts/diag/run-sql-diag.mjs
          else
            # Sem PII: limita saída a 50 linhas para reduzir ruído em logs públicos.
            node scripts/diag/run-sql-diag.mjs 2>&1 | head -n 50
          fi

      - name: Fazer upload do resultado (somente queries com allow_pii=true)
        # W27: artifact com retenção mínima (1 dia) — não fica nos logs de CI.
        # always(): garante upload mesmo quando a query falhou (Codex P2 — falha antes do upload sem isso).
        if: always() && env.DIAG_OUTPUT_FILE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sql-diag-output-${{ github.run_id }}
          path: ${{ env.DIAG_OUTPUT_FILE }}
          retention-days: 1

      - name: Registrar execução no audit_log
        if: always()
        # W28: registra hash da query (não a query em si) + metadados de rastreabilidade.
        # audit_log é a tabela de auditoria de negócio (trigger-based row audit) — não
        # tem detalhes/nivel/fonte, e 'acao' é restrito por CHECK a uma lista fechada.
        # 'SYSTEM_ACTION' é o valor do enum reservado para eventos de sistema como este;
        # tabela/registro_id (NOT NULL) descrevem a origem sintética do evento, e o
        # payload de diagnóstico vai em dados_novos (jsonb).
        env:
          RUN_ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          QUERY_HASH="$(sha256sum <<< "$DIAG_QUERY" | awk '{print $1}')"
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -q <<SQL || true
          INSERT INTO audit_log(acao, tabela, registro_id, dados_novos)
          VALUES (
            'SYSTEM_ACTION',
            'canonical-sql-diag',
            gen_random_uuid(),
            jsonb_build_object(
              'query_sha256', '$QUERY_HASH',
              'run_id', '$RUN_ID',
              'actor', '$RUN_ACTOR'
            )
          );
          SQL
