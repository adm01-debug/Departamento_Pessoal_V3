name: Canonical database — read-only SQL diagnostic

# Ferramenta de diagnóstico: roda UMA instrução SELECT/WITH/EXPLAIN/SHOW
# contra o banco canônico dentro de uma transação READ ONLY com ROLLBACK.
# Uso: Actions → "Canonical database — read-only SQL diagnostic" → Run,
# preencher confirm_project_ref (frjbfeamybqsejlvmqbl) e a consulta.
# Sem escrita possível: o runner valida a instrução e o banco rejeita
# qualquer DML/DDL dentro da transação somente-leitura.

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Digite o project ref canônico para evitar alvo acidental
        required: true
        type: string
      query:
        description: Consulta SQL (somente SELECT/WITH/EXPLAIN/SHOW)
        required: true
        type: string

concurrency:
  group: canonical-database-diag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sql-diag:
    name: diagnóstico SQL read-only no canônico
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CANONICAL_REF: frjbfeamybqsejlvmqbl
      CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
      DIAG_QUERY: ${{ inputs.query }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validar confirmação e URL sem revelar segredo
        run: |
          set -euo pipefail
          test "$CONFIRM_PROJECT_REF" = "$CANONICAL_REF" || {
            echo '::error::Project ref de confirmação não corresponde ao canônico.'
            exit 1
          }
          test -n "$SUPABASE_DB_URL" || {
            echo '::error::SUPABASE_DB_URL ausente.'
            exit 1
          }
          node scripts/validate-canonical-db-url.mjs

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Instalar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22'

      - name: Executar consulta read-only (ROLLBACK garantido)
        run: node scripts/diag/run-sql-diag.mjs
