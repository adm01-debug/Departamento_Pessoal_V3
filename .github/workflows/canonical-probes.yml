name: Canonical database — read-only security probes

# E51-018/E51-019: fecha os checkpoints remotos de RV-01/RV-02/RV-03/RV-04
# provando, no banco canônico vivo, que:
#   - user_empresa_id() ignora user_metadata forjado (RV-01)
#   - medidas_ciencia_tokens não tem ACL/policy exposta (RV-02)
#   - nenhuma policy permissiva (USING true) nas tabelas críticas (RV-03)
#   - as RPCs de vínculo/autorização existem (RV-04)
#   - as views de PII não são legíveis por anon
# Tudo em transações READ ONLY com ROLLBACK: nenhuma escrita é possível.

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_call:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Digite o project ref canônico para evitar alvo acidental
        required: true
        type: string

concurrency:
  group: canonical-database
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  security-probes:
    name: probes RV-01/02/03/04 no canônico
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CANONICAL_REF: frjbfeamybqsejlvmqbl
      CONFIRM_PROJECT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_project_ref || 'frjbfeamybqsejlvmqbl' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validar confirmação e URL sem revelar segredo
        run: |
          set -euo pipefail
          test "$CONFIRM_PROJECT_REF" = "$CANONICAL_REF" || {
            echo '::error::Project ref de confirmação não corresponde ao canônico.'
            exit 1
          }
          test -n "$SUPABASE_DB_URL" || {
            echo '::error::SUPABASE_DB_URL ausente.'
            exit 1
          }
          node scripts/validate-canonical-db-url.mjs

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Instalar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Executar e verificar probes read-only (ROLLBACK garantido)
        id: probes
        run: node scripts/probes/run-probes.mjs

      # W71: resumo estruturado (pass/fail por probe) — nunca dados de linha
      # de tabela de negócio (D4). `steps.probes.outputs.result` só contém
      # os booleans/contagens já validados por run-probes.mjs (ex.: "t"/"f"/"0"),
      # nunca PII.
      - name: Resumo das probes (GITHUB_STEP_SUMMARY)
        if: always()
        env:
          PROBES_RESULT: ${{ steps.probes.outputs.result }}
          PROBES_OUTCOME: ${{ steps.probes.outcome }}
        run: node scripts/probes/print-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      # W71/D8: schedule sem issue é um gap silencioso — ninguém sabia se
      # RV-01..04 continuavam passando. Mesmo padrão de dedupe de
      # healthcheck.yml/e2e.yml (W09): título estável, busca por label,
      # comenta se já existe issue aberta (com aviso de reincidência ≥7 dias),
      # cria se não existe.
      - name: Abrir ou atualizar issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="🔴 Canonical probes falharam (RV-01/02/03/04)"
          EXISTING=$(gh issue list --label canonical --state open --json number --limit 1 --jq '.[0].number' || true)
          BODY=$(printf 'Os probes de segurança do canônico (RV-01/02/03/04 + views de PII) falharam.\n\nCommit: %s\nRun: %s/%s/actions/runs/%s\n\nResumo pass/fail por probe (sem dados de linha) no "Summary" do run acima.\nVerificar runbook: infra/runbooks/RESPOSTA_INCIDENTES.md' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh label create canonical --force >/dev/null 2>&1 || true
          if [ -n "$EXISTING" ]; then
            ISSUE_CREATED=$(gh issue view "$EXISTING" --json createdAt --jq '.createdAt')
            ISSUE_EPOCH=$(date -d "$ISSUE_CREATED" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date +%s)
            DAYS_OLD=$(( (NOW_EPOCH - ISSUE_EPOCH) / 86400 ))
            if [ "$DAYS_OLD" -ge 7 ]; then
              COMMENT=$(printf '⚠️ Still failing — issue aberta há %d dias.\n\n%s' "$DAYS_OLD" "$BODY")
            else
              COMMENT="$BODY"
            fi
            gh issue comment "$EXISTING" --body "$COMMENT"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label canonical
          fi

      - name: Fechar issue ao recuperar
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --label canonical --state open --json number --limit 1 --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Canonical probes voltaram a passar (RV-01/02/03/04). Commit: $GITHUB_SHA | Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
