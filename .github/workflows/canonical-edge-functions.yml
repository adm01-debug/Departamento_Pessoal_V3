name: Canonical Supabase — Edge Functions

on:
  # W75: auto-deploy ao fazer merge em main quando funções mudam
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        # W76: obrigatório no dispatch manual para evitar alvo acidental;
        # no push em main o input é ignorado pelo GitHub Actions (não existe).
        description: Digite o project ref canônico para evitar alvo acidental
        required: true
        type: string

concurrency:
  group: canonical-edge-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validar e publicar Edge Functions no canônico
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CANONICAL_REF: frjbfeamybqsejlvmqbl
      CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # W37: ver ci.yml — Edge Runtime de produção é compatível com Deno 2.1
          # desde 15/08/2025. Revisado em 15/10/2026.
          deno-version: v2.1.x

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0

      - name: Validar alvo e autorização sem revelar segredo
        run: |
          set -euo pipefail
          # W76: no push em main a branch protegida já é a garantia; no
          # workflow_dispatch o operador confirma o ref manualmente.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRM_PROJECT_REF" = "$CANONICAL_REF" || {
              echo '::error::Project ref de confirmação não corresponde ao canônico.'
              exit 1
            }
          fi
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo '::error::SUPABASE_ACCESS_TOKEN ausente no environment production.'
            exit 1
          }
          supabase functions list \
            --project-ref "$CANONICAL_REF" \
            --output json >/tmp/functions-before.json
          echo "CANONICAL_EDGE_AUTHORIZATION_OK count=$(jq 'length' /tmp/functions-before.json)"

      - name: Type-check bloqueante de todos os entrypoints
        run: |
          set -euo pipefail
          errors=0
          while IFS= read -r fn; do
            if ! deno check --node-modules-dir=false "$fn"; then
              echo "::error file=$fn::Edge Function falhou no deno check"
              errors=$((errors + 1))
            fi
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print | LC_ALL=C sort)
          test "$errors" -eq 0

      - name: Publicar o inventário local sem excluir funções remotas
        run: |
          set -euo pipefail
          # Sem --prune: este workflow não apaga funções que ainda precisem ser
          # classificadas. O config.toml mantém verify_jwt=false somente para
          # os quatro endpoints que possuem autenticação pública própria.
          supabase functions deploy \
            --project-ref "$CANONICAL_REF" \
            --use-api \
            --jobs 4

      - name: Verificar inventário remoto pós-deploy
        run: |
          set -euo pipefail
          supabase functions list \
            --project-ref "$CANONICAL_REF" \
            --output json >/tmp/functions-after.json
          find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -printf '%h\n' \
            | xargs -r -n1 basename | LC_ALL=C sort -u >/tmp/slugs-local.txt
          jq -r '.[].slug' /tmp/functions-after.json | LC_ALL=C sort -u >/tmp/slugs-remote.txt
          missing="$(comm -23 /tmp/slugs-local.txt /tmp/slugs-remote.txt)"
          test -z "$missing" || {
            echo '::error::Inventário remoto não contém todos os slugs locais.'
            while IFS= read -r slug; do
              test -z "$slug" || echo "::error::Função ausente: $slug"
            done <<<"$missing"
            exit 1
          }
          local_count="$(wc -l </tmp/slugs-local.txt | tr -d ' ')"
          remote_count="$(wc -l </tmp/slugs-remote.txt | tr -d ' ')"
          echo "CANONICAL_EDGE_DEPLOY_OK local=$local_count remote=$remote_count"
