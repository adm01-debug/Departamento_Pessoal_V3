name: Protect Main Branch
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Protect main branch
        env:
          # Fine-grained PAT: Administration (repository) = Read and write.
          # O GITHUB_TOKEN não pode alterar branch protection e retorna HTTP 403.
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret BRANCH_PROTECTION_TOKEN não configurado"
            exit 1
          fi

          curl --fail-with-body --silent --show-error -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/branches/main/protection" \
            -d '{
              "required_status_checks": {"strict": true, "contexts": []},
              "enforce_admins": false,
              "required_pull_request_reviews": {
                "required_approving_review_count": 1,
                "dismiss_stale_reviews": true,
                "require_code_owner_reviews": false
              },
              "required_linear_history": true,
              "allow_force_pushes": false,
              "allow_deletions": false,
              "required_conversation_resolution": true
            }'
