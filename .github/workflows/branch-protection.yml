name: Protect Main Branch
# DESABILITADO (E01 — plano 100 etapas, 27/09/2026).
# Motivo: o payload atual usa PUT sem a regra required_status_checks; executar
# destruiria os 7 checks obrigatórios do ruleset 21934736.
# Reabilitar APENAS após E04 (payload completo validado em modo diff=E07).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protect:
    if: false   # E01 — congelado até E04+E07 serem concluídos
    runs-on: ubuntu-latest
    steps:
      - name: Protect main branch
        env:
          # Fine-grained PAT: Administration (repository) = Read and write.
          # O GITHUB_TOKEN não pode alterar rulesets e retorna HTTP 403.
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret BRANCH_PROTECTION_TOKEN não configurado"
            exit 1
          fi

          api="https://api.github.com/repos/${{ github.repository }}"
          ruleset_name="Departamento Pessoal V3 - protect main"

          owner_id="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$api" | jq -r '.owner.id')"

          ruleset_id="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$api/rulesets" | jq -r --arg name "$ruleset_name" \
            '[.[] | select(.name == $name)][0].id // empty')"

          payload="$(jq -n \
            --arg name "$ruleset_name" \
            --argjson owner_id "$owner_id" \
            '{
              name: $name,
              target: "branch",
              enforcement: "active",
              bypass_actors: [{
                actor_id: $owner_id,
                actor_type: "User",
                bypass_mode: "always"
              }],
              conditions: {
                ref_name: {include: ["~DEFAULT_BRANCH"], exclude: []}
              },
              rules: [
                {type: "deletion"},
                {type: "non_fast_forward"},
                {type: "required_linear_history"},
                {
                  type: "pull_request",
                  parameters: {
                    allowed_merge_methods: ["squash", "rebase"],
                    dismiss_stale_reviews_on_push: true,
                    require_code_owner_review: false,
                    require_last_push_approval: false,
                    required_approving_review_count: 1,
                    required_review_thread_resolution: true
                  }
                }
              ]
            }')"

          if [ -n "$ruleset_id" ]; then
            method="PUT"
            endpoint="$api/rulesets/$ruleset_id"
          else
            method="POST"
            endpoint="$api/rulesets"
          fi

          curl --fail-with-body --silent --show-error \
            -X "$method" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$endpoint" >/dev/null
