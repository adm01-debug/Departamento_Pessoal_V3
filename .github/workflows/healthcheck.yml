name: Environment Healthcheck

# E-095: verificação agendada a cada 6h do ambiente de produção.
# Falha abre/atualiza issue para visibilidade (schedule sem issue ninguém vê).

on:
  schedule:
    - cron: '17 */6 * * *' # a cada 6h, minuto 17 (fora da hora cheia)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  healthcheck:
    name: Healthcheck produção
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Rodar healthcheck
        id: hc
        env:
          APP_URL: ${{ vars.APP_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          REQUIRE_APP: '1'
          REQUIRE_BACKEND: '1'
        run: bash scripts/healthcheck.sh

      - name: Abrir issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🔴 Healthcheck falhou ($(date -u +%F\ %H:%M) UTC)"
          EXISTING=$(gh issue list --label healthcheck --state open --json number --jq '.[0].number' || true)
          # E79: printf — a versão anterior escrevia `\n` literal no corpo.
          BODY=$(printf 'O healthcheck agendado falhou.\n\nRun: %s/%s/actions/runs/%s\n\nVerificar runbook: infra/runbooks/RESPOSTA_INCIDENTES.md' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          # Garante a label antes de criar — se `gh issue create --label` falha
          # por label ausente, a issue era criada sem label e a deduplicação
          # quebrava na rodada seguinte (D12).
          gh label create healthcheck --force >/dev/null 2>&1 || true
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label healthcheck
          fi

      - name: Fechar issue ao recuperar
        # E80: ambiente voltou ao verde — encerra a issue aberta com evidência.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label healthcheck --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Healthcheck voltou ao verde. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
