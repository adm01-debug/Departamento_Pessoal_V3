name: Environment Healthcheck

# E-095: verificação agendada a cada 6h do ambiente de produção.
# Falha abre/atualiza issue para visibilidade (schedule sem issue ninguém vê).

on:
  schedule:
    - cron: '17 */6 * * *' # a cada 6h, minuto 17 (fora da hora cheia)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  healthcheck:
    name: Healthcheck produção
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Rodar healthcheck
        id: hc
        env:
          APP_URL: ${{ vars.APP_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          REQUIRE_APP: '1'
          REQUIRE_BACKEND: '1'
          # W91a: GITHUB_SHA já é exposto automaticamente pelo runner — o
          # script usa como EXPECTED_BUILD_SHA por padrão (ausência de
          # <meta name="build-sha"> em produção continua só um aviso).
          # W91b: login E2E não-admin — visibilidade sem bloquear o
          # scheduled job ainda (REQUIRE_LOGIN permanece 0/padrão até
          # confirmarmos estabilidade rodando a cada 6h).
          E2E_NON_ADMIN_EMAIL: ${{ secrets.E2E_NON_ADMIN_EMAIL }}
          E2E_NON_ADMIN_PASSWORD: ${{ secrets.E2E_NON_ADMIN_PASSWORD }}
        run: bash scripts/healthcheck.sh

      - name: Abrir issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # W09: título estável (sem data) — dedup usa --label, não o título.
          # A data/hora fica no link do run no body.
          TITLE="🔴 Healthcheck falhou"
          # W09: --limit 1 garante no máximo 1 resultado mesmo em race condition
          # entre execuções paralelas; jq .[0] sozinho não elimina o overhead.
          EXISTING=$(gh issue list --label healthcheck --state open --json number --limit 1 --jq '.[0].number' || true)
          # E79: printf — a versão anterior escrevia `\n` literal no corpo.
          # W09: $GITHUB_SHA adicionado para rastreabilidade por commit.
          BODY=$(printf 'O healthcheck agendado falhou.\n\nCommit: %s\nRun: %s/%s/actions/runs/%s\n\nVerificar runbook: infra/runbooks/RESPOSTA_INCIDENTES.md' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          # Garante a label antes de criar — se `gh issue create --label` falha
          # por label ausente, a issue era criada sem label e a deduplicação
          # quebrava na rodada seguinte (D12).
          gh label create healthcheck --force >/dev/null 2>&1 || true
          if [ -n "$EXISTING" ]; then
            # W09: stale check — se a issue tem 7+ dias, prefixar o comentário
            # com aviso de reincidência para aumentar visibilidade.
            ISSUE_CREATED=$(gh issue view "$EXISTING" --json createdAt --jq '.createdAt')
            ISSUE_EPOCH=$(date -d "$ISSUE_CREATED" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date +%s)
            DAYS_OLD=$(( (NOW_EPOCH - ISSUE_EPOCH) / 86400 ))
            if [ "$DAYS_OLD" -ge 7 ]; then
              COMMENT=$(printf '⚠️ Still failing — issue aberta há %d dias.\n\n%s' "$DAYS_OLD" "$BODY")
            else
              COMMENT="$BODY"
            fi
            gh issue comment "$EXISTING" --body "$COMMENT"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label healthcheck
          fi

      - name: Fechar issue ao recuperar
        # E80: ambiente voltou ao verde — encerra a issue aberta com evidência.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # W09: --limit 1 garante no máximo 1 resultado.
          EXISTING=$(gh issue list --label healthcheck --state open --json number --limit 1 --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            # W09: $GITHUB_SHA adicionado para rastreabilidade.
            gh issue close "$EXISTING" --comment "Healthcheck voltou ao verde. Commit: $GITHUB_SHA | Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
