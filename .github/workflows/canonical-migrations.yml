name: Canonical database — scoped migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Simular com ROLLBACK ou aplicar e registrar no ledger (verify=roda sidecars .verify.sql)
        required: true
        default: validate
        type: choice
        options: [validate, apply, verify]
      migration_files:
        description: "Lista de arquivos de migração separados por newline (obrigatório para mode=verify)"
        required: false
        type: string
      confirm_project_ref:
        description: Digite o project ref canônico para evitar alvo acidental
        required: true
        type: string

concurrency:
  group: canonical-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scoped-migrations:
    name: ${{ inputs.mode }} migrations no canônico
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CANONICAL_REF: frjbfeamybqsejlvmqbl
      # workflow_dispatch input is untrusted. Expose it as data instead of
      # interpolating it into the shell program below.
      CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
      MIGRATION_FILES: ${{ inputs.migration_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Gate de branch para apply e verify
        # E15/D4: DDL em produção só pode partir de código mergeado em main.
        # Antes, `apply` era disparado de branches de feature — o DDL aplicado
        # não correspondia a nenhum commit integrado.
        # Codex (P1, PR #244): estendido para `verify` — sidecars de feature
        # branches podem conter SQL que desativa default_transaction_read_only
        # e escreve no canônico usando as mesmas credenciais de apply.
        if: inputs.mode == 'apply' || inputs.mode == 'verify'
        run: |
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo '::error::mode=apply e mode=verify só podem ser disparados a partir da branch main.'
            exit 1
          }

      - name: Validar confirmação e URL sem revelar segredo
        run: |
          set -euo pipefail
          test "$CONFIRM_PROJECT_REF" = "$CANONICAL_REF" || {
            echo '::error::Project ref de confirmação não corresponde ao canônico.'
            exit 1
          }
          test -n "$SUPABASE_DB_URL" || {
            echo '::error::SUPABASE_DB_URL ausente.'
            exit 1
          }
          node scripts/validate-canonical-db-url.mjs

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 # W41: versão major fixa

      - name: Confirmar conexão e pré-condições canônicas
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At <<'SQL'
          SELECT CASE
            WHEN current_database() = 'postgres' THEN 'CANONICAL_CONNECTION_OK'
            ELSE pg_catalog.current_database() || ':UNEXPECTED_DATABASE'
          END;
          DO $preflight$
          DECLARE found integer; ledger_columns integer;
          BEGIN
            SELECT count(*) INTO found
            FROM pg_catalog.pg_class c
            JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
            WHERE (n.nspname,c.relname) IN (
              ('auth','users'),('public','rate_limits'),('public','user_empresas'),
              ('public','user_roles'),('public','relatorios_agendados'),
              ('public','provisoes_folha'),('public','provisoes_mensais'),
              ('public','colaboradores'),('public','audit_log'),('public','profiles'),
              ('storage','buckets'),('storage','objects'),('public','admissoes'),
              ('public','esocial_eventos'),('public','contrato_assinatura_tokens'),
              ('public','contratos_gerados')
            );
            IF found <> 16 THEN
              RAISE EXCEPTION 'canonical migration prerequisites missing (%/16)', found;
            END IF;
            IF to_regclass('supabase_migrations.schema_migrations') IS NULL THEN
              RAISE EXCEPTION 'canonical migration ledger is missing';
            END IF;
            SELECT count(*) INTO ledger_columns
            FROM information_schema.columns
            WHERE table_schema='supabase_migrations'
              AND table_name='schema_migrations'
              AND column_name IN ('version','name','statements');
            IF ledger_columns <> 3 THEN
              RAISE EXCEPTION 'canonical migration ledger contract is incompatible';
            END IF;
          END
          $preflight$;
          SELECT 'MIGRATION_PREREQUISITES_OK';
          SQL

      - name: Preparar somente as migrações aprovadas
        id: stage
        run: |
          set -euo pipefail
          stage_dir="$(mktemp -d)"
          mkdir -p "$stage_dir/supabase/migrations"
          cp supabase/config.toml "$stage_dir/supabase/config.toml"
          # NOTE: this list is intentionally replaced on every scoped batch,
          # not accumulated. Previous batches (up to
          # 20261011200000_check_constraints_operacional) are already applied and recorded
          # in supabase_migrations.schema_migrations; re-listing it here would
          # re-run non-idempotent CREATE POLICY statements and fail with
          # "policy already exists". Each dispatch of this workflow targets
          # only the NEW migrations for that batch.
          # Versões já presentes no ledger do canônico são puladas: um
          # re-dispatch do mesmo lote não pode re-executar as migrações.
          applied="$(psql "$SUPABASE_DB_URL" -X -At -c "SELECT version FROM supabase_migrations.schema_migrations")"
          for migration in \
            20261015160000_ci_auditor_readonly_role.sql \
            20261015170000_ci_auditor_revoke_public_secdef.sql \
            20261018120000_onda4d_review243.sql \
            20261018130000_onda4e_objetos_ausentes.sql \
            20261018140000_onda5_ponto_cols.sql \
            20261018150000_onda5_rescisao_detalhes_calculo.sql \
            20261018160000_dedup_idempotency_anomalies_job.sql \
            20261018170000_default_privs_revoke_execute_public.sql \
            20261018200000_qa2_pix_lote_idempotente.sql \
            20261019000000_qa3_db_fixes.sql \
            20261020000000_colaboradores_metadata.sql \
            20261021000000_ledger_reconcile_secdef_defaults.sql \
            20261021010000_default_privs_for_role.sql \
            20261022000000_qa5_db_fixes.sql \
            20261023000000_qa_r3_fixes.sql \
            20261024000000_qa_r4_fixes.sql \
            20261027000000_revoke_orphan_secdef.sql \
            20261027120000_qa_r5_fixes.sql \
            20261028120000_qa_r5_review_fixes.sql \
            20261028130000_revoke_orphan_secdef_v2.sql \
            20261029000000_gaps_v2_verificacao.sql
          do
            version="${migration%%_*}"
            if printf '%s\n' "$applied" | grep -qx "$version"; then
              echo "skip $migration — versão $version já registrada no ledger canônico"
              continue
            fi
            cp "supabase/migrations/$migration" "$stage_dir/supabase/migrations/$migration"
            # sidecar de verificação (<nome>.verify.sql) acompanha a migration
            sidecar="${migration%.sql}.verify.sql"
            if [ -f "supabase/migrations/$sidecar" ]; then
              cp "supabase/migrations/$sidecar" "$stage_dir/supabase/migrations/$sidecar"
            fi
          done
          echo "dir=$stage_dir" >> "$GITHUB_OUTPUT"

      - name: Simular todas as mudanças no schema real e reverter
        run: |
          set -euo pipefail
          stage_dir="${{ steps.stage.outputs.dir }}"
          # Roda em AMBOS os modos: no mode=apply serve como gate — a aplicação
          # só executa se o dry-run BEGIN/ROLLBACK do conteúdo exato passar.
          shopt -s nullglob
          migrations=("$stage_dir"/supabase/migrations/*.sql)
          if [ "${#migrations[@]}" -eq 0 ]; then
            echo 'Nada a aplicar — lote já registrado no ledger canônico.'
            echo 'CANONICAL_MIGRATION_DRY_RUN_OK'
            exit 0
          fi
          {
            echo 'BEGIN;'
            for migration in "${migrations[@]}"; do
              printf '\\i %s\n' "$migration"
            done
            echo 'ROLLBACK;'
          } | psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1
          echo 'CANONICAL_MIGRATION_DRY_RUN_OK'

      - name: Aplicar a lista fechada e registrar no ledger
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          stage_dir="${{ steps.stage.outputs.dir }}"
          # Execute the same closed list validated above and record only those
          # versions. This deliberately avoids `db push --include-all` and
          # `migration repair`, which are unsafe while the historical local
          # ledger differs from the canonical ledger.
          shopt -s nullglob
          apply_migrations=("$stage_dir"/supabase/migrations/*.sql)
          if [ "${#apply_migrations[@]}" -eq 0 ]; then
            echo 'Nada a aplicar — lote já registrado no ledger canônico.'
            exit 0
          fi
          {
            echo 'BEGIN;'
            for migration in "${apply_migrations[@]}"; do
              filename="$(basename "$migration")"
              version="${filename%%_*}"
              name="${filename#*_}"
              name="${name%.sql}"
              printf '\\i %s\n' "$migration"
              # statements guarda o conteúdo exato aplicado (rastreabilidade),
              # via literal dollar-quoted para preservar aspas/formato do arquivo
              printf "INSERT INTO supabase_migrations.schema_migrations(version,name,statements) VALUES ('%s','%s',ARRAY[\$dp_mig_stmt\$\n" "$version" "$name"
              cat "$migration"
              printf "\n\$dp_mig_stmt\$]::text[]) ON CONFLICT (version) DO NOTHING;\n"
            done
            echo 'COMMIT;'
          } | psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1

      - name: Verificar sidecars das migrações
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          stage_dir="${{ steps.stage.outputs.dir }}"
          # Cada <migration>.verify.sql emite linhas 'ok' quando os objetos
          # criados pela migration batem o esperado; qualquer outra linha
          # reprova o deploy.
          shopt -s nullglob
          sidecars=("$stage_dir"/supabase/migrations/*.verify.sql)
          for sidecar in "${sidecars[@]}"; do
            echo "::group::$(basename "$sidecar")"
            out="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -f "$sidecar")"
            printf '%s\n' "$out"
            non_empty="$(printf '%s\n' "$out" | grep -vE '^\s*$' || true)"
            if [ -z "$non_empty" ]; then
              echo "::error::sidecar $(basename "$sidecar") retornou saída vazia — migration pode não ter sido aplicada"
              exit 1
            fi
            if printf '%s\n' "$non_empty" | grep -vx 'ok' | grep -q .; then
              echo "::error::sidecar $(basename "$sidecar") falhou — linha diferente de 'ok'"
              exit 1
            fi
            echo "::endgroup::"
          done
          echo 'CANONICAL_SIDECARS_OK'

      - name: Verificar objetos e ledger
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          # Verifica no ledger as versões DESTE lote (uma por migration da
          # lista fechada acima — conferidas pelo ledger_count no assert final)
          # + os objetos/invariantes que cada migration cria (antes conferia
          # só a versão do lote anterior, que podia não existir e falhar após
          # um COMMIT bem-sucedido).
          # legacy_rls_missing conta tabelas legacy EXISTENTES sem RLS — a
          # versão anterior esperava === 4, que falha quando a tabela não
          # existe no canônico (to_regclass NULL faz o DO da migration pular).
          result="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -f scripts/canonical-invariants.sql)"
          echo "$result"
          node -e '
            const r = JSON.parse(process.argv[1]);
            const ok =
              Number(r.ledger_count) === 29 &&
              r.notificacoes_chk_wide === true &&
              r.logs_sistema_unlocked === true &&
              r.elr_uses_created_at === true &&
              r.d5_fn_uses_contexto === true &&
              r.auto_purge_allowed === true &&
              Number(r.onda3b_jobs_ok) === 15 &&
              r.onda3b_dupes_gone === true &&
              Number(r.cron_fix_fns_ok) === 4 &&
              r.ferias_daily_no_direct_concluida === true &&
              Number(r.cron_jobs_ok) === 2 &&
              r.ferias_job_uses_wrapper === true &&
              r.holerite_sync_trigger_ok === true &&
              r.notify_fn_fixed === true &&
              r.self_read_requires_closed === true &&
              r.cnab_seq_table_ok === true &&
              r.cnab_remessa_uniq_ok === true &&
              Number(r.check_constraints_count) === 7 &&
              r.search_path_ok === true &&
              r.rls_helper_ok === true &&
              r.admin_list_ok === true &&
              r.get_admin_ids_ok === true &&
              r.competencia_fmt_ok === true &&
              Number(r.legacy_rls_missing) === 0 &&
              r.token_helper_locked === true &&
              r.is_admin_self_scoped === true &&
              r.is_admin_anon_locked === true &&
              r.scope_fn_anon_locked === true &&
              r.auditoria_empresa_col === true &&
              r.auditoria_tenant_trigger === true &&
              r.auditoria_policy_scoped === true &&
              r.taxas_policy_auth === true &&
              r.auditoria_no_permissive === true &&
              r.taxas_no_permissive === true &&
              r.audit_fn_locked === true &&
              r.vinculo_col === true &&
              r.vinculo_fn_locked === true &&
              r.doc_empresa_col === true &&
              r.lgpd_fns_locked === true &&
              r.banco_enc_cols === true &&
              r.banco_view_scoped === true &&
              r.periodos_no_for_all === true &&
              r.onda4c_vinculo_unambiguous === true &&
              r.onda4c_no_guc_fallback === true &&
              r.onda4c_purge_resets_guc === true &&
              r.onda4c_docs_rh_policy === true &&
              r.onda4c_ledger_repaired === true &&
              r.onda4d_vinculo_counts_all === true &&
              r.onda4d_sync_trigger === true &&
              r.onda4d_stmts_recorded === true &&
              Number(r.onda4e_objs) === 7 &&
              Number(r.onda5_cols) === 4 &&
              r.onda5_stmts_recorded === true &&
              r.rescisao_detalhes_col === true &&
              r.rescisao_stmts_recorded === true &&
              r.colab_metadata_col === true &&
              Number(r.pix_lote_cols) === 2 &&
              r.espelho_revogado_col === true &&
              r.espelho_idx_partial === true &&
              r.desl_guard_detalhes === true &&
              r.qa5_stmts_recorded === true &&
              r.espelho_guard_fn === true &&
              r.qa_r4_stmts_recorded === true &&
              Number(r.sec_cron_jobs_ok) === 3 &&
              Number(r.sec_fns_ok) === 6 &&
              r.registros_ponto_gated === true &&
              r.desl_delete_blocks_pago === true &&
              r.folha_delete_blocks_paga === true &&
              r.contas_admin_bypass === true &&
              r.anonimizar_latest === true &&
              r.orphan_secdef_revoked === true &&
              r.decrypt_wrapper_ok === true &&
              r.ferias_chk_wide === true &&
              r.qa3_stmts_recorded === true &&
              r.onda4e_mv_filled === true &&
              r.onda4e_stmts_recorded === true &&
              r.ci_auditor_role === true &&
              r.idem_dup_job_gone === true &&
              r.idem_hourly_job_ok === true &&
              r.gaps_v2_parametros_manage === true &&
              r.gaps_v2_faltas_trigger === true &&
              r.gaps_v2_afd_table === true;
            if (!ok) process.exit(1);
          ' "$result"
          echo 'CANONICAL_SCHEMA_INVARIANTS_OK'

          # W69: executar sidecars .verify.sql para cada migração do lote.
          # Crie supabase/migrations/<versão>_<nome>.verify.sql com SELECTs
          # que retornam 'ok' para verificar objetos criados pela migration.
          #
          # Codex review (P2, PR #238): um sidecar que segue o contrato
          # documentado (SELECT retornando um valor, não uma exceção) sempre
          # fazia o `psql` sair com código 0 -- a query em si é válida mesmo
          # quando o valor retornado é 'f'/'fail'/qualquer coisa diferente de
          # 'ok'. O `|| { ... }` só pegava erro de processo/SQL, nunca um
          # assert que falhou dentro do próprio SELECT -- ou seja, um sidecar
          # escrito exatamente como o comentário acima instrui nunca
          # reprovava o apply. Agora capturamos a saída (-t -A: tuplas sem
          # formatação) e exigimos que toda linha não-vazia seja literalmente
          # 'ok'; qualquer outro valor conta como falha do sidecar.
          stage_dir="${{ steps.stage.outputs.dir }}"
          sidecar_errors=0
          for migration in "$stage_dir"/supabase/migrations/*.sql; do
            filename="$(basename "$migration")"
            sidecar="supabase/migrations/${filename%.sql}.verify.sql"
            if [ -f "$sidecar" ]; then
              echo "Sidecar: $sidecar"
              sidecar_output="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -t -A -f "$sidecar")" || {
                echo "::error::Sidecar falhou (erro de execução): $sidecar"
                sidecar_errors=$((sidecar_errors + 1))
                continue
              }
              # Codex (P2, PR #242-followup): rejeitar sidecar sem nenhuma asserção
              # (arquivo vazio ou só de comentários passaria sem checar nada).
              non_empty="$(printf '%s\n' "$sidecar_output" | grep -v '^[[:space:]]*$')"
              if [ -z "$non_empty" ]; then
                echo "::error::Sidecar não produziu nenhuma asserção (saída vazia): $sidecar"
                sidecar_errors=$((sidecar_errors + 1))
                continue
              fi
              bad_lines="$(printf '%s\n' "$non_empty" | grep -vx 'ok' || true)"
              if [ -n "$bad_lines" ]; then
                echo "::error::Sidecar reportou assert(s) que não retornaram 'ok': $sidecar"
                printf '%s\n' "$bad_lines" | sed 's/^/::error::   valor inesperado: /'
                sidecar_errors=$((sidecar_errors + 1))
              fi
            fi
          done
          test "$sidecar_errors" -eq 0
          echo 'CANONICAL_SCOPED_MIGRATIONS_OK'

      - name: Executar sidecars de verificação (mode=verify)
        # Codex review (P2, PR #242): o loop de sidecars em "Verificar objetos
        # e ledger" só roda para migrações staged em mode=apply (lote NOVO,
        # ainda fora do ledger) — um sidecar de uma migração JÁ aplicada
        # (como 20261013152000_onda4b_vinculo_documentos_lgpd_crypto.verify.sql,
        # criado em W80 para uma migração reaplicada numa onda anterior) nunca
        # entra nesse lote de novo, então nunca é executado por nenhum run
        # normal. mode=verify roda os sidecars listados em migration_files
        # diretamente do checkout (sem stage/apply/ledger) — só leitura, mesmo
        # contrato de saída do loop em "Verificar objetos e ledger": cada
        # linha não-vazia precisa ser literalmente 'ok'.
        #
        # Codex review (P1, PR #242): além do gate de branch (main-only,
        # acima), a sessão psql entra em default_transaction_read_only
        # antes de rodar o arquivo — um sidecar que violasse o contrato
        # (INSERT/UPDATE/DELETE/DDL em vez de só SELECT) falha com erro de
        # Postgres em vez de mutar o canônico, mesmo que tenha sido mergeado
        # em main.
        #
        # Codex review (P2, PR #242): a primeira versão usava
        # `-c 'SET default_transaction_read_only = on;' -f sidecar` na mesma
        # chamada de psql — mas psql imprime a tag de status ("SET") do -c
        # no mesmo stdout capturado, e isso sempre reprovava o
        # `grep -vx 'ok'` abaixo (toda run de verify falharia). Troca para
        # PGOPTIONS: o GUC é setado no startup da conexão (libpq), não como
        # um comando executado na sessão — nenhuma tag extra no stdout.
        if: inputs.mode == 'verify'
        run: |
          set -euo pipefail
          verify_errors=0
          migrations_processed=0
          while IFS= read -r migration; do
            migration="$(echo "$migration" | tr -d '[:space:]')"
            [ -z "$migration" ] && continue
            migrations_processed=$((migrations_processed + 1))
            # Extrair versão: prefixo numérico do nome do arquivo (sem path, sem .sql).
            version="$(basename "${migration%.sql}")"
            version="${version%%_*}"
            # Codex (P2, PR #242-followup): validar que a migração está no ledger canônico
            # antes de rodar seu sidecar — impede aprovar um sidecar para uma migração
            # pendente ou parcialmente criada via DDL manual.
            # Codex (P1, PR #244): psql -c não expande :'v' (psql metacommand);
            # usar stdin (printf | psql) para que a interpolação seja processada.
            ledger_count="$(printf '%s\n' \
              "SELECT count(*) FROM supabase_migrations.schema_migrations WHERE version = :'v';" | \
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -v "v=$version")"
            if [ "$ledger_count" -ne 1 ]; then
              echo "::error::Migração $version não encontrada no ledger canônico — mode=verify só aceita migrações JÁ aplicadas."
              verify_errors=$((verify_errors + 1))
              continue
            fi
            sidecar="supabase/migrations/${migration%.sql}.verify.sql"
            if [ ! -f "$sidecar" ]; then
              echo "::error::Sidecar não encontrado para $migration: $sidecar"
              verify_errors=$((verify_errors + 1))
              continue
            fi
            echo "Sidecar: $sidecar (ledger ✓ versão $version)"
            sidecar_output="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -t -A -f "$sidecar")" || {
              echo "::error::Sidecar falhou (erro de execução): $sidecar"
              verify_errors=$((verify_errors + 1))
              continue
            }
            # Codex (P2, PR #242-followup): rejeitar sidecar sem nenhuma asserção.
            non_empty="$(printf '%s\n' "$sidecar_output" | grep -v '^[[:space:]]*$')"
            if [ -z "$non_empty" ]; then
              echo "::error::Sidecar não produziu nenhuma asserção (saída vazia): $sidecar"
              verify_errors=$((verify_errors + 1))
              continue
            fi
            bad_lines="$(printf '%s\n' "$non_empty" | grep -vx 'ok' || true)"
            if [ -n "$bad_lines" ]; then
              echo "::error::Sidecar reportou assert(s) que não retornaram 'ok': $sidecar"
              printf '%s\n' "$bad_lines" | sed 's/^/::error::   valor inesperado: /'
              verify_errors=$((verify_errors + 1))
            fi
          done <<< "$MIGRATION_FILES"
          # Codex (P2, PR #244): falhar quando nenhuma migração foi processada —
          # lista vazia ou só espaços em branco não constitui verificação válida.
          if [ "$migrations_processed" -eq 0 ]; then
            echo '::error::mode=verify requer pelo menos uma migração em migration_files — lista vazia ou só espaços em branco.'
            exit 1
          fi
          test "$verify_errors" -eq 0
          echo 'CANONICAL_VERIFY_OK'

      - name: Resumo das migrações (GITHUB_STEP_SUMMARY)
        if: always()
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          MIGRATIONS_STAGE: ${{ steps.stage.outputs.dir }}
        run: |
          stage_dir="$MIGRATIONS_STAGE"
          {
            echo "## Resumo de migrações canônicas"
            echo ""
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Modo | $DISPATCH_MODE |"
            echo "| Project ref | $CONFIRM_PROJECT_REF |"
            if [ -d "$stage_dir/supabase/migrations" ] && compgen -G "$stage_dir/supabase/migrations/*.sql" > /dev/null 2>&1; then
              summary_hash="$( (cd "$stage_dir/supabase/migrations" && find . -maxdepth 1 -name '*.sql' -print0 | sort -z | xargs -0 sha256sum) | sha256sum | awk '{print $1}')"
              echo "| Hash da lista | \`$summary_hash\` |"
              echo ""
              echo "### Migrações staged"
              echo ""
              echo "| Arquivo |"
              echo "|---------|"
              for f in "$stage_dir"/supabase/migrations/*.sql; do
                echo "| \`$(basename "$f")\` |"
              done
            else
              echo "| Migrações staged | nenhuma / stage não disponível |"
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
