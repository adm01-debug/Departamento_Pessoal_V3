name: Canonical database — scoped migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          validate=simula com ROLLBACK · apply=aplica e registra no ledger ·
          verify=só roda sidecars .verify.sql de migrações já aplicadas
          (read-only, sem tocar em stage/ledger — ver migration_files)
        required: true
        default: validate
        type: choice
        options: [validate, apply, verify]
      confirm_project_ref:
        description: Digite o project ref canônico para evitar alvo acidental
        required: true
        type: string
      migration_files:
        description: >-
          Arquivos de migração (um por linha, ex: 20261013150000_onda4a.sql).
          Em mode=validate pode ficar vazio: a lista é derivada (W67) comparando
          supabase/migrations/*.sql com o ledger do canônico. Em mode=apply é
          obrigatório e precisa ser idêntico ao último validate verde no mesmo
          SHA (W68) — copie a lista do resumo daquele run. Em mode=verify é
          obrigatório: migrações JÁ aplicadas cujo sidecar <versão>.verify.sql
          você quer re-executar agora contra o canônico (sem reaplicar nada).
        required: false
        type: string

concurrency:
  group: canonical-database
  cancel-in-progress: false

permissions:
  contents: read
  # W68: necessário para listar/baixar, via API, o artifact `validated-<sha>`
  # produzido por um run de validate anterior (actions/upload-artifact e
  # actions/download-artifact no MESMO run não precisam deste escopo; a
  # leitura cross-run via REST, sim).
  actions: read

jobs:
  scoped-migrations:
    name: ${{ inputs.mode }} migrations no canônico
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CANONICAL_REF: frjbfeamybqsejlvmqbl
      # workflow_dispatch inputs are untrusted. Expose them as data instead of
      # interpolating them into shell programs below.
      CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
      MIGRATION_FILES: ${{ inputs.migration_files }}
      DISPATCH_MODE: ${{ inputs.mode }}
      VALIDATED_ARTIFACT_NAME: validated-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Gate de branch para apply/verify
        # E15/D4: DDL em produção só pode partir de código mergeado em main.
        # Antes, `apply` era disparado de branches de feature — o DDL aplicado
        # não correspondia a nenhum commit integrado.
        #
        # Codex review (P1, PR #242): mode=verify roda o conteúdo de um
        # .verify.sql direto do ref do checkout contra o canônico — sem este
        # gate, um dispatch numa branch de feature executaria SQL não
        # revisado (e potencialmente mutante, apesar do contrato ser
        # read-only) em produção. Mesmo gate do apply.
        if: inputs.mode == 'apply' || inputs.mode == 'verify'
        run: |
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo "::error::mode=$DISPATCH_MODE só pode ser disparado a partir da branch main."
            exit 1
          }

      - name: Validar confirmação e URL sem revelar segredo
        run: |
          set -euo pipefail
          test "$CONFIRM_PROJECT_REF" = "$CANONICAL_REF" || {
            echo '::error::Project ref de confirmação não corresponde ao canônico.'
            exit 1
          }
          test -n "$SUPABASE_DB_URL" || {
            echo '::error::SUPABASE_DB_URL ausente.'
            exit 1
          }
          # W67: apply nunca deriva a lista sozinho — exige o input explícito
          # (a mesma lista confirmada num validate anterior; W68 confere isso).
          if [ "$DISPATCH_MODE" = 'apply' ] && [ -z "$MIGRATION_FILES" ]; then
            echo '::error::mode=apply exige migration_files explícito e idêntico ao último validate verde (W67/W68).'
            exit 1
          fi
          if [ "$DISPATCH_MODE" = 'verify' ] && [ -z "$MIGRATION_FILES" ]; then
            echo '::error::mode=verify exige migration_files com as migrações já aplicadas a re-verificar.'
            exit 1
          fi
          node scripts/validate-canonical-db-url.mjs

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 # W41: versão major fixa

      - name: Confirmar conexão e pré-condições canônicas
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At <<'SQL'
          SELECT CASE
            WHEN current_database() = 'postgres' THEN 'CANONICAL_CONNECTION_OK'
            ELSE pg_catalog.current_database() || ':UNEXPECTED_DATABASE'
          END;
          DO $preflight$
          DECLARE found integer; ledger_columns integer;
          BEGIN
            SELECT count(*) INTO found
            FROM pg_catalog.pg_class c
            JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
            WHERE (n.nspname,c.relname) IN (
              ('auth','users'),('public','rate_limits'),('public','user_empresas'),
              ('public','user_roles'),('public','relatorios_agendados'),
              ('public','provisoes_folha'),('public','provisoes_mensais'),
              ('public','colaboradores'),('public','audit_log'),('public','profiles'),
              ('storage','buckets'),('storage','objects'),('public','admissoes'),
              ('public','esocial_eventos'),('public','contrato_assinatura_tokens'),
              ('public','contratos_gerados')
            );
            IF found <> 16 THEN
              RAISE EXCEPTION 'canonical migration prerequisites missing (%/16)', found;
            END IF;
            IF to_regclass('supabase_migrations.schema_migrations') IS NULL THEN
              RAISE EXCEPTION 'canonical migration ledger is missing';
            END IF;
            SELECT count(*) INTO ledger_columns
            FROM information_schema.columns
            WHERE table_schema='supabase_migrations'
              AND table_name='schema_migrations'
              AND column_name IN ('version','name','statements');
            IF ledger_columns <> 3 THEN
              RAISE EXCEPTION 'canonical migration ledger contract is incompatible';
            END IF;
          END
          $preflight$;
          SELECT 'MIGRATION_PREREQUISITES_OK';
          SQL

      - name: Derivar lista de migrações pendentes quando migration_files vier vazio
        # W67: nunca hardcoded. Só deriva em validate — apply sempre exige a
        # lista explícita (checado acima) para não aplicar nada que não foi
        # conferido por um humano no resumo do validate.
        if: inputs.mode == 'validate' && env.MIGRATION_FILES == ''
        run: |
          set -euo pipefail
          applied_file="$(mktemp)"
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" \
            > "$applied_file"
          derived_json="$(node scripts/db/derive-pending-migrations.mjs --applied-versions "$applied_file")"
          echo "$derived_json"
          pending_files="$(node -e '
            const data = JSON.parse(require("fs").readFileSync(0, "utf8"));
            process.stdout.write(data.pending_files.join("\n"));
          ' <<< "$derived_json")"
          {
            echo "MIGRATION_FILES<<MIGRATION_FILES_EOF_W67"
            echo "$pending_files"
            echo "MIGRATION_FILES_EOF_W67"
          } >> "$GITHUB_ENV"
          {
            echo '### W67 — lista derivada automaticamente (migration_files estava vazio)'
            echo ''
            echo 'Nenhum arquivo foi informado no campo migration_files. A lista abaixo'
            echo 'foi derivada comparando os arquivos de supabase/migrations com o'
            echo 'ledger (supabase_migrations.schema_migrations) no canônico.'
            echo ''
            echo 'CONFIRME esta lista antes de repetir o dispatch com mode=apply —'
            echo 'copie exatamente estas linhas para o campo migration_files.'
            echo ''
            echo '```text'
            echo "$pending_files"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar somente as migrações aprovadas
        id: stage
        run: |
          set -euo pipefail
          stage_dir="$(mktemp -d)"
          mkdir -p "$stage_dir/supabase/migrations"
          cp supabase/config.toml "$stage_dir/supabase/config.toml"
          # W67: lista nunca hardcoded — vem do input migration_files (ou da
          # derivação automática acima, em validate, quando ele vier vazio).
          # Cada dispatch cobre só as migrações NOVAS do lote: não reliste
          # migrações já aplicadas (CREATE POLICY etc. não são idempotentes
          # e falhariam com "policy already exists").
          while IFS= read -r migration; do
            migration="$(echo "$migration" | tr -d '[:space:]')"
            [ -z "$migration" ] && continue
            test -f "supabase/migrations/$migration" || {
              echo "::error::Migration não encontrada: supabase/migrations/$migration"
              exit 1
            }
            cp "supabase/migrations/$migration" "$stage_dir/supabase/migrations/$migration"
          done <<< "$MIGRATION_FILES"
          echo "dir=$stage_dir" >> "$GITHUB_OUTPUT"

      - name: Simular todas as mudanças no schema real e reverter
        id: validate-dry-run
        if: inputs.mode == 'validate'
        env:
          MIGRATIONS_STAGE: ${{ steps.stage.outputs.dir }}
        run: |
          set -euo pipefail
          # Lote vazio é um caso válido (ex: smoke test W99) — sem nullglob o
          # glob sem match vira literal "*.sql" e quebra o \i no psql.
          shopt -s nullglob
          stage_dir="$MIGRATIONS_STAGE"
          {
            echo 'BEGIN;'
            for migration in "$stage_dir"/supabase/migrations/*.sql; do
              printf '\\i %s\n' "$migration"
            done
            echo 'ROLLBACK;'
          } | psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1
          echo 'CANONICAL_MIGRATION_DRY_RUN_OK'
          # W68: grava lista + hash num artifact (validated-<sha>.json) em vez
          # de confiar num input `validated_hash` copiado à mão — o apply
          # (mesmo SHA) baixa este artifact pela API e confere automaticamente.
          validated_hash="$( (cd "$stage_dir/supabase/migrations" && find . -maxdepth 1 -name '*.sql' -print0 | sort -z | xargs -0 sha256sum) | sha256sum | awk '{print $1}')"
          files_json="$(cd "$stage_dir/supabase/migrations" && find . -maxdepth 1 -name '*.sql' -print0 | sort -z | xargs -0 -I{} basename {} | node -e '
            const lines = require("fs").readFileSync(0, "utf8").split("\n").filter(Boolean);
            process.stdout.write(JSON.stringify(lines));
          ')"
          artifact_dir="$(mktemp -d)"
          node -e '
            const fs = require("fs");
            const [, , outPath, sha, hash, filesJson] = process.argv;
            const files = JSON.parse(filesJson);
            fs.writeFileSync(outPath, JSON.stringify({
              sha, hash, files, generated_at: new Date().toISOString(),
            }, null, 2) + "\n");
          ' "$artifact_dir/${VALIDATED_ARTIFACT_NAME}.json" "$GITHUB_SHA" "$validated_hash" "$files_json"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          echo "validated_hash=$validated_hash" >> "$GITHUB_OUTPUT"
          {
            echo "### W68 — artifact de validação"
            echo ""
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Artifact | \`${VALIDATED_ARTIFACT_NAME}\` |"
            echo "| Hash | \`$validated_hash\` |"
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Publicar artifact de validação (W68)
        if: inputs.mode == 'validate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.VALIDATED_ARTIFACT_NAME }}
          path: ${{ steps.validate-dry-run.outputs.artifact_dir }}/${{ env.VALIDATED_ARTIFACT_NAME }}.json
          retention-days: 14
          if-no-files-found: error

      - name: Baixar e conferir o artifact de validação correspondente (W68)
        id: fetch-validated-artifact
        if: inputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api_base="repos/${GITHUB_REPOSITORY}/actions/artifacts"
          artifacts_json="$(gh api "${api_base}?name=${VALIDATED_ARTIFACT_NAME}&per_page=100")"
          artifact_id="$(node -e '
            const data = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const name = process.argv[1];
            const candidates = (data.artifacts || [])
              .filter((a) => a.name === name && a.expired === false)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            if (candidates.length === 0) process.exit(1);
            process.stdout.write(String(candidates[0].id));
          ' "$VALIDATED_ARTIFACT_NAME" <<< "$artifacts_json")" || {
            echo "::error::Nenhum artifact '${VALIDATED_ARTIFACT_NAME}' encontrado (W68). Rode mode=validate neste mesmo SHA antes de apply."
            exit 1
          }
          command -v unzip >/dev/null 2>&1 || sudo apt-get install -y -qq unzip
          download_url="$(gh api "${api_base}/${artifact_id}" --jq '.archive_download_url')"
          fetch_dir="$(mktemp -d)"
          curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -o "$fetch_dir/artifact.zip" "$download_url"
          unzip -o -q "$fetch_dir/artifact.zip" -d "$fetch_dir"
          artifact_file="$fetch_dir/${VALIDATED_ARTIFACT_NAME}.json"
          test -f "$artifact_file" || {
            echo "::error::Artifact '${VALIDATED_ARTIFACT_NAME}' baixado sem o JSON esperado (W68)."
            exit 1
          }
          echo "path=$artifact_file" >> "$GITHUB_OUTPUT"

      - name: Aplicar a lista fechada e registrar no ledger
        if: inputs.mode == 'apply'
        env:
          MIGRATIONS_STAGE: ${{ steps.stage.outputs.dir }}
          VALIDATED_ARTIFACT_PATH: ${{ steps.fetch-validated-artifact.outputs.path }}
        run: |
          set -euo pipefail
          # Lote vazio é um caso válido (ex: smoke test W99) — ver nota acima.
          shopt -s nullglob
          stage_dir="$MIGRATIONS_STAGE"
          # W68: a lista/hash do apply precisa ser idêntica à do artifact
          # validated-<sha> baixado do run de validate mais recente no mesmo
          # SHA — não basta mais um input `validated_hash` digitado à mão.
          current_hash="$( (cd "$stage_dir/supabase/migrations" && find . -maxdepth 1 -name '*.sql' -print0 | sort -z | xargs -0 sha256sum) | sha256sum | awk '{print $1}')"
          echo "Hash da lista (apply): $current_hash"
          node -e '
            const fs = require("fs");
            const artifact = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const expectedSha = process.argv[2];
            const expectedHash = process.argv[3];
            if (artifact.sha !== expectedSha) {
              console.error(
                "::error::Artifact validado é de outro SHA (" + artifact.sha +
                "), esperado " + expectedSha + " (W68).",
              );
              process.exit(1);
            }
            if (artifact.hash !== expectedHash) {
              console.error(
                "::error::Hash da lista de apply (" + expectedHash +
                ") difere do hash validado (" + artifact.hash + ") (W68).",
              );
              process.exit(1);
            }
          ' "$VALIDATED_ARTIFACT_PATH" "$GITHUB_SHA" "$current_hash"
          echo 'CANONICAL_APPLY_MATCHES_VALIDATED_ARTIFACT_OK'
          # Execute the same closed list validated above and record only those
          # versions. This deliberately avoids db push --include-all and
          # migration repair, which are unsafe while the historical local
          # ledger differs from the canonical ledger.
          content_args=()
          for migration in "$stage_dir"/supabase/migrations/*.sql; do
            filename="$(basename "$migration")"
            version="${filename%%_*}"
            content_var="content_${version}"
            # W70: statements grava o conteúdo real do arquivo (um elemento
            # de array, o arquivo inteiro) em vez de ARRAY[] vazio, para que
            # "supabase migration list" reconheça o lote. O conteúdo vai via
            # psql -v + :'var', que faz o quoting seguro do literal — evita
            # escapar manualmente aspas/ponto-e-vírgula do SQL da migração.
            content_args+=(-v "${content_var}=$(cat "$migration")")
          done
          {
            echo 'BEGIN;'
            for migration in "$stage_dir"/supabase/migrations/*.sql; do
              filename="$(basename "$migration")"
              version="${filename%%_*}"
              name="${filename#*_}"
              name="${name%.sql}"
              content_var="content_${version}"
              printf '\\i %s\n' "$migration"
              printf "INSERT INTO supabase_migrations.schema_migrations(version,name,statements) VALUES ('%s','%s',ARRAY[:'%s']::text[]) ON CONFLICT (version) DO NOTHING;\n" "$version" "$name" "$content_var"
            done
            echo 'COMMIT;'
          } | psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 "${content_args[@]}"

      - name: Verificar objetos e ledger
        if: inputs.mode == 'apply'
        env:
          MIGRATIONS_STAGE: ${{ steps.stage.outputs.dir }}
        run: |
          set -euo pipefail
          # Lote vazio é um caso válido (ex: smoke test W99): `IN ()` é
          # inválido em SQL, então pula a query nesse caso em vez de gerá-la.
          shopt -s nullglob
          stage_dir="$MIGRATIONS_STAGE"

          # W69: verificação genérica do ledger — não hardcoded por lote.
          # Calcula versões do stage e confirma que todas entraram no ledger.
          version_list=""
          staged_count=0
          for migration in "$stage_dir"/supabase/migrations/*.sql; do
            filename="$(basename "$migration")"
            version="${filename%%_*}"
            version_list="${version_list:+${version_list},}'${version}'"
            staged_count=$((staged_count + 1))
          done
          if [ "$staged_count" -eq 0 ]; then
            ledger_found=0
          else
            ledger_found="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At \
              -c "SELECT count(*) FROM supabase_migrations.schema_migrations WHERE version IN ($version_list)")"
          fi
          test "$ledger_found" -eq "$staged_count" || {
            echo "::error::Ledger incompleto: ${ledger_found}/${staged_count} versões do lote."
            exit 1
          }
          echo "CANONICAL_LEDGER_OK staged=$staged_count ledger=$ledger_found"

          # Invariantes de schema acumulados (ondas anteriores).
          # legacy_rls_missing conta tabelas legacy EXISTENTES sem RLS.
          result="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At <<'SQL'
          SELECT jsonb_build_object(
            'notificacoes_chk_wide', EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname = 'chk_notificacoes_tipo'
                AND pg_get_constraintdef(oid) LIKE '%ferias_pagamento_d5%'
            ),
            'logs_sistema_unlocked', NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgrelid = 'public.logs_sistema'::regclass AND NOT tgisinternal
                AND tgname IN ('trg_logs_sistema_no_delete','trg_logs_sistema_no_update')
            ),
            'elr_uses_created_at', NOT EXISTS (
              SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public' AND p.proname = 'enforce_log_retention'
                AND p.prosrc LIKE '%attempted_at%'
            ),
            'd5_fn_uses_contexto', EXISTS (
              SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public' AND p.proname = 'notificar_ferias_pagamento_d5'
                AND p.prosrc LIKE '%nivel, mensagem, contexto%'
            ),
            'auto_purge_allowed', EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname = 'audit_log_acao_check'
                AND pg_get_constraintdef(oid) LIKE '%AUTO_PURGE%'
            ),
            'onda3b_jobs_ok', (
              SELECT count(*) FROM cron.job WHERE jobname IN (
                'audit_log_monthly_purge','cleanup-ciencia-rate-limits',
                'cleanup-logs-sistema-daily','dp-health-snapshot',
                'dp-log-rotation-check','dp-partition-monthly',
                'dp-retention-anonymize-90d','dp-retention-delete-730d',
                'ferias-recalcular-dobra-diario','gerar-alertas-preditivos-ia-daily',
                'lovable-audit-retention-daily','lovable-log-retention',
                'notificar-ferias-pagamento-d5','purgar_ferias_reconciliacao_logs_diario',
                'lgpd-retention-dry-run'
              )
            ),
            'onda3b_dupes_gone', NOT EXISTS (
              SELECT 1 FROM cron.job WHERE jobname IN (
                'update-despesa-updated-at-daily','check-idempotency-anomalies-hourly',
                'cleanup-old-logs-weekly','purge-idempotency-keys-daily',
                'lovable-ia-provisao-alertas','gerar-alertas-ia-diario',
                'ia-provisao-alertas-diario'
              )
            ),
            'cron_fix_fns_ok', (
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public' AND p.proname IN (
                'purge_rate_limits','fn_atualizar_status_ferias_diario',
                'drenar_fila_limpeza_lgpd','process_lgpd_cleanup_queue'
              )
            ),
            'ferias_daily_no_direct_concluida', NOT EXISTS (
              SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public' AND p.proname = 'fn_atualizar_status_ferias_diario'
                AND p.prosrc LIKE '%status = ''aprovada''%data_fim%'
            ),
            'cron_jobs_ok', (
              SELECT count(*) FROM cron.job
              WHERE jobname IN ('ferias-atualizar-status-diario','lgpd-fila-drenagem-daily')
            ),
            'ferias_job_uses_wrapper', EXISTS (
              SELECT 1 FROM cron.job WHERE jobname = 'ferias-atualizar-status-diario'
                AND command LIKE '%fn_atualizar_status_ferias_diario%'
            ),
            'holerite_sync_trigger_ok', EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'trg_sync_holerite_folha_item'
                AND tgrelid = 'public.folha_itens'::regclass AND NOT tgisinternal
            ),
            'notify_fn_fixed', NOT EXISTS (
              SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public' AND p.proname = 'fn_enqueue_notification'
                AND p.prosrc LIKE '%NEW.competencia%'
            ),
            'self_read_requires_closed', EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'holerites'
                AND policyname = 'holerites_self_read' AND qual LIKE '%fechada%'
            ),
            'cnab_seq_table_ok', to_regclass('public.cnab_sequencias') IS NOT NULL,
            'cnab_remessa_uniq_ok', to_regclass('public.cnab_remessas_empresa_folha_uniq') IS NOT NULL,
            'check_constraints_count', (
              SELECT count(*) FROM pg_constraint WHERE conname IN (
                'ferias_datas_coerentes','batidas_precisao_positiva',
                'emprestimos_valor_total_positivo','benef_colab_vigencia_coerente',
                'faixas_maximo_coerente','candidaturas_nota_faixa',
                'promocoes_salarios_nao_negativos'
              )
            ),
            'search_path_ok', EXISTS (
              SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public' AND p.proname = 'contrato_assinar_por_token'
                AND p.pronargs = 5
                AND array_to_string(p.proconfig, ',') LIKE '%extensions%'
            ),
            'rls_helper_ok', to_regproc('public.rls_tenant_or_admin') IS NOT NULL,
            'admin_list_ok', to_regproc('public.admin_list_profiles') IS NOT NULL,
            'get_admin_ids_ok', to_regproc('public.get_empresa_admin_ids') IS NOT NULL,
            'competencia_fmt_ok', EXISTS (
              SELECT 1 FROM pg_constraint WHERE conname = 'folhas_pagamento_competencia_fmt'
            ),
            'legacy_rls_missing', (
              SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND NOT c.relrowsecurity
                AND c.relname IN ('eventos_rh','folha_pagamento','ponto_registros','rubricas')
            ),
            'token_helper_locked', NOT has_function_privilege(
              'anon', 'public._admissao_token_row(text)', 'EXECUTE'
            ),
            'is_admin_self_scoped', EXISTS (
              SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public' AND p.proname = 'is_admin'
                AND p.prosrc LIKE '%auth.uid() IS NULL%'
            ),
            'is_admin_anon_locked', NOT has_function_privilege(
              'anon', 'public.is_admin(uuid)', 'EXECUTE'
            ),
            'scope_fn_anon_locked', NOT has_function_privilege(
              'anon', 'public.get_user_scope_empresas(uuid)', 'EXECUTE'
            ),
            'auditoria_empresa_col', EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'provisao_auditoria'
                AND column_name = 'empresa_id'
            ),
            'auditoria_tenant_trigger', EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'trg_provisao_auditoria_empresa'
                AND tgrelid = 'public.provisao_auditoria'::regclass
                AND NOT tgisinternal
            ),
            'auditoria_policy_scoped', EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'provisao_auditoria'
                AND policyname = 'Auditoria de provisao para perfis internos'
                AND qual LIKE '%empresa_id%'
            ),
            'taxas_policy_auth', EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'taxas_cambio'
                AND policyname = 'taxas_cambio_authenticated_select'
            ),
            'auditoria_no_permissive', NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'provisao_auditoria'
                AND NOT (policyname = 'Auditoria de provisao para perfis internos'
                         AND roles = '{authenticated}'::name[] AND cmd = 'SELECT')
            ),
            'audit_fn_locked', NOT has_function_privilege(
              'anon', 'public.provisao_auditoria_set_empresa()', 'EXECUTE'
            ),
            'vinculo_col', EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='colaboradores' AND column_name='user_id'
            ),
            'vinculo_fn_locked', NOT has_function_privilege(
              'anon', 'public.vincular_colaborador_ao_usuario()', 'EXECUTE'
            ) AND to_regprocedure('public.vincular_colaborador_ao_usuario()') IS NOT NULL,
            'doc_empresa_col', EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='documentos' AND column_name='empresa_id'
            ),
            'lgpd_fns_locked', to_regprocedure('public.run_lgpd_purge(boolean)') IS NOT NULL
              AND to_regprocedure('public.drenar_fila_limpeza_lgpd(integer)') IS NOT NULL
              AND NOT has_function_privilege('anon','public.run_lgpd_purge(boolean)','EXECUTE')
              AND NOT has_function_privilege('anon','public.drenar_fila_limpeza_lgpd(integer)','EXECUTE'),
            'banco_enc_cols', (SELECT count(*) FROM information_schema.columns
              WHERE table_schema='public' AND column_name LIKE '%\_encrypted'
                AND table_name IN ('contas_bancarias','pix_itens')) = 5,
            'banco_view_scoped', to_regclass('public.contas_bancarias_decrypted') IS NOT NULL,
            'taxas_no_permissive', NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'taxas_cambio'
                AND NOT (policyname = 'taxas_cambio_authenticated_select'
                         AND roles = '{authenticated}'::name[] AND cmd = 'SELECT')
            ),
            'periodos_no_for_all', NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'periodos_ponto'
                AND policyname = 'auth_periodos_ponto'
            )
          );
          SQL
          )"
          echo "$result"
          node -e '
            const r = JSON.parse(process.argv[1]);
            const ok =
              r.notificacoes_chk_wide === true &&
              r.logs_sistema_unlocked === true &&
              r.elr_uses_created_at === true &&
              r.d5_fn_uses_contexto === true &&
              r.auto_purge_allowed === true &&
              Number(r.onda3b_jobs_ok) === 15 &&
              r.onda3b_dupes_gone === true &&
              Number(r.cron_fix_fns_ok) === 4 &&
              r.ferias_daily_no_direct_concluida === true &&
              Number(r.cron_jobs_ok) === 2 &&
              r.ferias_job_uses_wrapper === true &&
              r.holerite_sync_trigger_ok === true &&
              r.notify_fn_fixed === true &&
              r.self_read_requires_closed === true &&
              r.cnab_seq_table_ok === true &&
              r.cnab_remessa_uniq_ok === true &&
              Number(r.check_constraints_count) === 7 &&
              r.search_path_ok === true &&
              r.rls_helper_ok === true &&
              r.admin_list_ok === true &&
              r.get_admin_ids_ok === true &&
              r.competencia_fmt_ok === true &&
              Number(r.legacy_rls_missing) === 0 &&
              r.token_helper_locked === true &&
              r.is_admin_self_scoped === true &&
              r.is_admin_anon_locked === true &&
              r.scope_fn_anon_locked === true &&
              r.auditoria_empresa_col === true &&
              r.auditoria_tenant_trigger === true &&
              r.auditoria_policy_scoped === true &&
              r.taxas_policy_auth === true &&
              r.auditoria_no_permissive === true &&
              r.taxas_no_permissive === true &&
              r.audit_fn_locked === true &&
              r.vinculo_col === true &&
              r.vinculo_fn_locked === true &&
              r.doc_empresa_col === true &&
              r.lgpd_fns_locked === true &&
              r.banco_enc_cols === true &&
              r.banco_view_scoped === true &&
              r.periodos_no_for_all === true;
            if (!ok) process.exit(1);
          ' "$result"
          echo 'CANONICAL_SCHEMA_INVARIANTS_OK'

          # W69: executar sidecars .verify.sql para cada migração do lote.
          # Crie supabase/migrations/<versão>_<nome>.verify.sql com SELECTs
          # que retornam 'ok' para verificar objetos criados pela migration.
          #
          # Codex review (P2, PR #238): um sidecar que segue o contrato
          # documentado (SELECT retornando um valor, não uma exceção) sempre
          # fazia o `psql` sair com código 0 -- a query em si é válida mesmo
          # quando o valor retornado é 'f'/'fail'/qualquer coisa diferente de
          # 'ok'. O `|| { ... }` só pegava erro de processo/SQL, nunca um
          # assert que falhou dentro do próprio SELECT -- ou seja, um sidecar
          # escrito exatamente como o comentário acima instrui nunca
          # reprovava o apply. Agora capturamos a saída (-t -A: tuplas sem
          # formatação) e exigimos que toda linha não-vazia seja literalmente
          # 'ok'; qualquer outro valor conta como falha do sidecar.
          sidecar_errors=0
          for migration in "$stage_dir"/supabase/migrations/*.sql; do
            filename="$(basename "$migration")"
            sidecar="supabase/migrations/${filename%.sql}.verify.sql"
            if [ -f "$sidecar" ]; then
              echo "Sidecar: $sidecar"
              sidecar_output="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -t -A -f "$sidecar")" || {
                echo "::error::Sidecar falhou (erro de execução): $sidecar"
                sidecar_errors=$((sidecar_errors + 1))
                continue
              }
              bad_lines="$(printf '%s\n' "$sidecar_output" | grep -v '^[[:space:]]*$' | grep -vx 'ok' || true)"
              if [ -n "$bad_lines" ]; then
                echo "::error::Sidecar reportou assert(s) que não retornaram 'ok': $sidecar"
                printf '%s\n' "$bad_lines" | sed 's/^/::error::   valor inesperado: /'
                sidecar_errors=$((sidecar_errors + 1))
              fi
            fi
          done
          test "$sidecar_errors" -eq 0
          echo 'CANONICAL_SCOPED_MIGRATIONS_OK'

      - name: Executar sidecars de verificação (mode=verify)
        # Codex review (P2, PR #242): o loop de sidecars em "Verificar objetos
        # e ledger" só roda para migrações staged em mode=apply (lote NOVO,
        # ainda fora do ledger) — um sidecar de uma migração JÁ aplicada
        # (como 20261013152000_onda4b_vinculo_documentos_lgpd_crypto.verify.sql,
        # criado em W80 para uma migração reaplicada numa onda anterior) nunca
        # entra nesse lote de novo, então nunca é executado por nenhum run
        # normal. mode=verify roda os sidecars listados em migration_files
        # diretamente do checkout (sem stage/apply/ledger) — só leitura, mesmo
        # contrato de saída do loop em "Verificar objetos e ledger": cada
        # linha não-vazia precisa ser literalmente 'ok'.
        #
        # Codex review (P1, PR #242): além do gate de branch (main-only,
        # acima), a sessão psql entra em default_transaction_read_only
        # antes de rodar o arquivo — um sidecar que violasse o contrato
        # (INSERT/UPDATE/DELETE/DDL em vez de só SELECT) falha com erro de
        # Postgres em vez de mutar o canônico, mesmo que tenha sido mergeado
        # em main.
        #
        # Codex review (P2, PR #242): a primeira versão usava
        # `-c 'SET default_transaction_read_only = on;' -f sidecar` na mesma
        # chamada de psql — mas psql imprime a tag de status ("SET") do -c
        # no mesmo stdout capturado, e isso sempre reprovava o
        # `grep -vx 'ok'` abaixo (toda run de verify falharia). Troca para
        # PGOPTIONS: o GUC é setado no startup da conexão (libpq), não como
        # um comando executado na sessão — nenhuma tag extra no stdout.
        if: inputs.mode == 'verify'
        run: |
          set -euo pipefail
          verify_errors=0
          while IFS= read -r migration; do
            migration="$(echo "$migration" | tr -d '[:space:]')"
            [ -z "$migration" ] && continue
            sidecar="supabase/migrations/${migration%.sql}.verify.sql"
            if [ ! -f "$sidecar" ]; then
              echo "::error::Sidecar não encontrado para $migration: $sidecar"
              verify_errors=$((verify_errors + 1))
              continue
            fi
            echo "Sidecar: $sidecar"
            sidecar_output="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -t -A -f "$sidecar")" || {
              echo "::error::Sidecar falhou (erro de execução): $sidecar"
              verify_errors=$((verify_errors + 1))
              continue
            }
            bad_lines="$(printf '%s\n' "$sidecar_output" | grep -v '^[[:space:]]*$' | grep -vx 'ok' || true)"
            if [ -n "$bad_lines" ]; then
              echo "::error::Sidecar reportou assert(s) que não retornaram 'ok': $sidecar"
              printf '%s\n' "$bad_lines" | sed 's/^/::error::   valor inesperado: /'
              verify_errors=$((verify_errors + 1))
            fi
          done <<< "$MIGRATION_FILES"
          test "$verify_errors" -eq 0
          echo 'CANONICAL_VERIFY_OK'

      - name: Resumo das migrações (GITHUB_STEP_SUMMARY)
        if: always()
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          MIGRATIONS_STAGE: ${{ steps.stage.outputs.dir }}
        run: |
          stage_dir="$MIGRATIONS_STAGE"
          {
            echo "## Resumo de migrações canônicas"
            echo ""
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Modo | $DISPATCH_MODE |"
            echo "| Project ref | $CONFIRM_PROJECT_REF |"
            if [ -d "$stage_dir/supabase/migrations" ] && compgen -G "$stage_dir/supabase/migrations/*.sql" > /dev/null 2>&1; then
              summary_hash="$( (cd "$stage_dir/supabase/migrations" && find . -maxdepth 1 -name '*.sql' -print0 | sort -z | xargs -0 sha256sum) | sha256sum | awk '{print $1}')"
              echo "| Hash da lista | \`$summary_hash\` |"
              echo ""
              echo "### Migrações staged"
              echo ""
              echo "| Arquivo |"
              echo "|---------|"
              for f in "$stage_dir"/supabase/migrations/*.sql; do
                echo "| \`$(basename "$f")\` |"
              done
            else
              echo "| Migrações staged | nenhuma / stage não disponível |"
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
