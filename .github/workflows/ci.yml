name: Continuous Integration & Delivery

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # W49: Para PRs, cancela runs mais antigos (mesmo ref). Para pushes na main,
  # cada SHA recebe grupo próprio (sem cancelamento entre pushes distintos) —
  # evita ocultar falha de um commit ao chegar o seguinte.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  changes:
    name: Mudanças de caminho (paths-filter)
    # W45: evita rodar edge-functions/p0-migrations/lighthouse em todo PR
    # quando nada relevante mudou (ex.: PR só de docs). Só filtra em PR —
    # push/dispatch na main sempre roda tudo, sem depender do último diff.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      edge: ${{ steps.filter.outputs.edge }}
      migrations: ${{ steps.filter.outputs.migrations }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      # Codex review (P1, PR #238): o modo via API do GitHub (token) resolve
      # o diff de pull_request contra a API (base/head do PR), mas push e
      # workflow_dispatch não têm um PR para comparar -- sem checkout local,
      # o paths-filter não tinha como calcular `git diff` contra
      # `github.event.before`, e o job ERRARIA em todo push/dispatch na main,
      # derrubando em cascata o check obrigatório "Edge Functions" via
      # `needs: changes`. fetch-depth: 0 garante histórico completo para o
      # diff funcionar nos três eventos (pull_request, push, workflow_dispatch).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          token: ${{ github.token }}
          filters: |
            edge:
              - 'supabase/functions/**'
              - 'deno.lock'
              - 'scripts/typecheck-edge.sh'
              # Codex review (P2, PR #238): sem este arquivo aqui, um PR que
              # só mudasse a própria lógica do job edge-functions (versão do
              # Deno, flags, comando) nunca setava edge=true -- o check
              # obrigatório "Edge Functions (deno check)" passaria pelo echo
              # de "sem mudanças" sem exercitar o que de fato mudou.
              - '.github/workflows/ci.yml'
            migrations:
              - 'supabase/migrations/**'
              - 'scripts/tests/**'
            frontend:
              - 'src/**'
              - 'vite.config.ts'
              - 'package-lock.json'
              - 'lighthouserc.cjs'

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type Check (src)
        run: npm run typecheck
      - name: Type Check (tests)
        run: npm run typecheck:tests
      - name: Type Check (e2e)
        run: npm run typecheck:e2e

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint:ci
      - name: Orçamento de `any` por diretório (E51-025)
        # lint:ci só limita o TOTAL de warnings; um PR pode remover 50 `any`
        # em um diretório e adicionar 50 em outro sem mudar o total. Este
        # gate falha por diretório individualmente, não pela soma.
        run: npm run audit:ratchet-any
      - name: Orçamento de `any` em testes (E51-029)
        # eslint.config.js ignora **/*.test.* e __tests__/ globalmente — os
        # `any` em testes são invisíveis ao lint:ci. Ratchet irmão com
        # baseline próprio (scripts/.any-tests-baseline.json), mesma regra
        # por diretório: só pode descer.
        run: npm run audit:ratchet-any-tests
      - name: Orçamento de warnings por regra (E43)
        # lint:ci limita o TOTAL mas não por regra: um PR pode trocar 20
        # warnings de `any` por 20 de outra regra sem estourar o teto. Este
        # gate falha se QUALQUER regra subir (baseline .eslint-warnings-
        # budget.json). Existia desde a auditoria mas nunca rodava no CI.
        run: npm run audit:ratchet-warnings
      - name: Drift de tipos × migrations
        # Tabela criada por migration sem entrada em types.ts abre janela para
        # queries untyped. Ratchet: baseline lista divergências conhecidas,
        # qualquer divergência nova reprova o PR.
        run: npm run audit:types-drift
      - name: Frescura do mapa de colunas (validateTablePayload)
        # src/schemas/tableColumns.ts é gerado de types.ts; se types.ts mudar e o
        # mapa não for regerado, o validador estrutural valida contra colunas
        # desatualizadas. Regenerar com: npm run gen:table-columns
        run: npm run gen:table-columns -- --check
      - name: Lint Edge Functions
        run: npm run lint:edge
      - name: Format changed source files
        # D26: Em push na main, GITHUB_BASE_REF é vazio → diff é vazio →
        # nenhum arquivo é verificado (gate sempre passa). Comportamento
        # intencional: o formato foi validado no PR que gerou o push.
        run: npm run format:check:changed

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || '' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit Tests
        # E41: sem RUN_LIVE_RLS_TESTS aqui — o smoke contra o banco canônico
        # vive no job `rls-live` (push main, não bloqueante), para o teste
        # unitário de PR deixar de flutuar com a saúde do Supabase.
        run: npm run test:coverage
      - name: Upload coverage report
        # E42: artefato para inspeção sem abrir o log + resumo no step summary.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
      - name: Resumo de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const s = require("./coverage/coverage-summary.json").total;
              const row = (k) => "| " + k + " | " + s[k].pct + "% (" + s[k].covered + "/" + s[k].total + ") |";
              console.log("| Métrica | Cobertura |\n|---|---|");
              ["lines","statements","functions","branches"].forEach(k => console.log(row(k)));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

  rls-live:
    name: RLS live (pós-merge, não bloqueante)
    # E41: smoke real contra o banco canônico, isolado do gate de PR. Roda só
    # no SHA integrado em main; falha aqui não impede merge, mas abre issue.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      RUN_LIVE_RLS_TESTS: 'true'
      REQUIRE_LIVE_RLS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Smoke RLS/RPC contra o canônico
        run: npx vitest run src/tests/rpc-permissions.test.ts
      - name: Abrir issue em caso de falha na main
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # W09: título estável sem timestamp — dedup via --label, não título.
          TITLE="🔴 Smoke RLS live falhou na main"
          # W09: --limit 1 evita overhead e race condition em runs paralelas.
          EXISTING=$(gh issue list --label ci-main --state open --json number --limit 1 --jq '.[0].number' || true)
          # W09: $GITHUB_SHA para rastreabilidade por commit.
          BODY=$(printf 'O smoke de permissões/RLS contra o banco canônico falhou em push na main.\n\nCommit: %s\nRun: %s/%s/actions/runs/%s' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh label create ci-main --force >/dev/null 2>&1 || true
          if [ -n "$EXISTING" ]; then
            # W09: stale check — issue aberta há ≥7 dias recebe aviso de reincidência.
            ISSUE_CREATED=$(gh issue view "$EXISTING" --json createdAt --jq '.createdAt')
            ISSUE_EPOCH=$(date -d "$ISSUE_CREATED" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date +%s)
            DAYS_OLD=$(( (NOW_EPOCH - ISSUE_EPOCH) / 86400 ))
            if [ "$DAYS_OLD" -ge 7 ]; then
              COMMENT=$(printf '⚠️ Still failing — issue aberta há %d dias.\n\n%s' "$DAYS_OLD" "$BODY")
            else
              COMMENT="$BODY"
            fi
            gh issue comment "$EXISTING" --body "$COMMENT"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label ci-main
          fi

  lighthouse:
    name: Lighthouse & orçamento de bundle (E51-030)
    # W45: não é required check — skip simples quando nada em src/**,
    # vite.config.ts, package-lock.json ou lighthouserc.cjs mudou.
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || '' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Orçamento de bundle
        # E51-030: baseline em scripts/.bundle-budget.json — o tamanho do
        # bundle só pode descer; afrouxar exige editar o baseline no PR.
        run: npm run audit:bundle
      - name: Lighthouse CI (rotas públicas)
        # Rotas autenticadas redirecionam para /login sem credenciais — o
        # audit cobre /login e /verificar-contrato, as páginas públicas.
        run: ./node_modules/.bin/lhci autorun

  edge-functions:
    name: Edge Functions (deno check)
    # W45: required check — nunca pode virar "skipped" sem rodar nada (essa é
    # exatamente a armadilha do D3/"verde por omissão" que o W15 corrigiu
    # para db-integrity). Em vez de condicionar o job inteiro, cada step real
    # é condicionado e um step de sucesso explícito cobre o caso sem mudança
    # relevante -- o job SEMPRE conclui com um resultado real, nunca "skipped".
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'pull_request' || needs.changes.outputs.edge == 'true'
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: github.event_name != 'pull_request' || needs.changes.outputs.edge == 'true'
        with:
          # W37 (tentativa revertida, 15/10/2026): pinar em v2.1.x quebrou o
          # type-check real (TS2315 "Type 'Uint8Array' is not generic" em
          # supabase/functions/criptografia/index.ts:61 — lib TS mais antiga
          # que o v2.x flutuante vinha resolvendo). "Edge Runtime compatível
          # com Deno 2.1" (changelog supabase.com/changelog/37941) não
          # significa a CLI exata 2.1.x -- confirmado pelo CI vermelho real.
          # Mantido v2.x até existir uma forma de validar o pin antes de
          # aplicar (ex.: Deno local neste runner).
          deno-version: v2.x
      - name: Type-check de todas as Edge Functions (gate bloqueante)
        if: github.event_name != 'pull_request' || needs.changes.outputs.edge == 'true'
        # E40: fonte única — scripts/typecheck-edge.sh checa o bridge com zero
        # tolerância e depois faz o loop em todas as funções, listando todo o
        # inventário de falhas antes de encerrar com erro.
        run: bash scripts/typecheck-edge.sh
      - name: Testes unitários das Edge Functions
        if: github.event_name != 'pull_request' || needs.changes.outputs.edge == 'true'
        # E39: descoberta automática — `deno test` num diretório acha todo
        # `*.test.ts` recursivamente; a lista de 15 globs hardcoded deixava
        # fora do CI 8 arquivos (calcular-folha, fechar-folha, processar-ponto*,
        # reabrir-folha, external-db-bridge/timeout, webhook).
        run: deno test --allow-env --no-lock --node-modules-dir=false supabase/functions/
      - name: Sem mudanças em supabase/functions/** — sucesso explícito
        if: github.event_name == 'pull_request' && needs.changes.outputs.edge != 'true'
        run: echo "Nenhum arquivo em supabase/functions/**, deno.lock ou scripts/typecheck-edge.sh mudou neste PR — pulado com sucesso explícito (W45)."

  security-config:
    name: Config de segurança (E-077, estático)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Contrato físico dos eventos de auditoria Edge
        # Análise AST estática (não precisa de banco nem secrets). Movido
        # de typecheck para cá para manter typecheck puro.
        run: |
          npm run audit:edge-audit-log
          node scripts/tests/audit-edge-audit-log-contract.test.mjs
      - name: Gate de configuração de segurança
        # E-077: verify_jwt deny-by-default, CORS sem wildcard, security
        # headers, ausência de segredos hardcoded e SW sem cache de PII.
        # Estático (não precisa de DATABASE_URL) — roda em todo PR.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/audit-security-config.mjs
          node scripts/audit-required-checks.mjs
          node scripts/audit-bridge-frontend-contract.mjs
          node scripts/validate-plan-50.mjs
          node scripts/audit-canonical-project.mjs
          node scripts/audit-migration-style.mjs
          node scripts/tests/rebaseline-artifact.test.mjs
          node scripts/tests/validate-canonical-db-url.test.mjs
          node scripts/tests/workflows-contract.test.mjs
      - name: Lockfile único npm (W03)
        run: bash scripts/tests/lockfile-single.test.sh
      - name: Resumo dos contratos (GITHUB_STEP_SUMMARY)
        if: always()
        run: |
          {
            echo "## security-config"
            echo "| Script | Status |"
            echo "|--------|--------|"
            echo "| workflows-contract | ${{ job.status }} |"
            echo "| lockfile-single | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  p0-database-migrations:
    name: P0 database migration simulations (shard ${{ matrix.shard }}/3)
    # W45: não é required check — skip simples quando nada em
    # supabase/migrations/** ou scripts/tests/** mudou.
    # W47: paralelizado em 3 shards via strategy.matrix — cada shard roda num
    # runner próprio, com seu próprio Postgres descartável (nenhum estado
    # compartilhado entre shards). Distribuição round-robin determinística em
    # scripts/tests/run-shard.sh, sobre a mesma descoberta automática (find |
    # sort) que o job usava antes de virar matrix — nenhuma lista hardcoded.
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.migrations == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Os scripts de simulação SQL não fazem chamadas à API do GitHub. Mantém o
    # token mínimo e evita deixá-lo no git config enquanto executam SQL de PR.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Simular a migração em PostgreSQL descartável (shard ${{ matrix.shard }}/3)
        # W47: scripts/tests/run-shard.sh descobre migrations-p0-*,
        # migrations-p1-* e migrations-plano100.sh do mesmo jeito que o loop
        # original (find | sort) e roda só o subconjunto deste shard. Novos
        # scripts adicionados a scripts/tests/ entram automaticamente, sem
        # alteração no workflow. W52: absorve db-tests.yml (deletado).
        run: bash scripts/tests/run-shard.sh ${{ matrix.shard }}/3
      - name: Resumo do shard (GITHUB_STEP_SUMMARY)
        if: always()
        run: |
          {
            echo "## p0-database-migrations — shard ${{ matrix.shard }}/3"
            echo "| Shard | Status |"
            echo "|-------|--------|"
            echo "| ${{ matrix.shard }}/3 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  db-integrity:
    name: Integridade do banco (search_path x extensões)
    # W25: check obrigatório de PR, só estático e sem segredo. As auditorias
    # leem o catálogo de produção, que um PR não altera (migrations só entram
    # via canonical-migrations), então rodá-las no PR expunha a credencial sem
    # validar nada do PR. A parte com banco roda em db-integrity-live.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Regressão fail-closed dos auditores
        run: npm run test:db-audit-contract
      - name: Resumo da integridade estática (GITHUB_STEP_SUMMARY)
        if: always()
        run: |
          {
            echo "## db-integrity (estático)"
            echo "| db-audit-contract | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  db-integrity-live:
    name: Integridade do banco canônico (live)
    # W15/W23/W24/W25: roda em push na main, dispatch E PRs internos (não forks).
    # • Fork: pull_request de fork nunca recebe secrets do repositório — GitHub
    #   trata esse caso automaticamente (DATABASE_URL vem vazia).
    # • Dependabot: mesmo sendo PR same-repo (não fork), o GitHub também retém
    #   secrets de PRs abertas por Dependabot por padrão — DATABASE_URL vem
    #   vazia aqui também, tratado como caso esperado (não erro).
    # • PR interno sem DATABASE_URL: falha fechada — credencial deve existir.
    # • W24: usa SUPABASE_DB_URL_READONLY (role ci_auditor, só catálogo) em vez
    #   do admin — os 7 scripts deste job são introspecção pura (search_path,
    #   policies, triggers, função SECURITY DEFINER, hints de relacionamento),
    #   nunca leem linha de tabela de negócio nem gravam nada. Secret de
    #   repositório comum (sem `environment:`): a primeira tentativa usava
    #   `environment: production`, que bloqueia o job INTEIRO (0 steps) em
    #   qualquer branch != main por deployment_branch_policy — quebrava este
    #   job em toda PR interna, não só nesta (achado real em CI, run
    #   38759559111/job 116507412690). Least-privilege torna o gate
    #   desnecessário: nenhum destes scripts precisa de admin em nenhum evento.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL_READONLY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Verificar disponibilidade do alvo canônico
        id: db-access
        # W15: fork/Dependabot não recebem secrets de repositório — não é erro.
        # PR interno sem DATABASE_URL é erro: a credencial deve ter sido configurada.
        # github.actor passado via env para não violar D20 (sem ${{ }} em run:).
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            if [ "${ACTOR}" = "dependabot[bot]" ]; then
              echo "::notice::Auditor role indisponível para este ator — alvo canônico não disponível para Dependabot."
              echo "skip_live=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::SUPABASE_DB_URL ausente. O gate de integridade não pode aprovar sem auditar o banco canônico."
              exit 1
            fi
          else
            echo "skip_live=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar cliente psql
        if: steps.db-access.outputs.skip_live != 'true'
        # W41: versão major fixa — sem regressão silenciosa por bump do apt.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
      - name: Auditar search_path das funções
        if: steps.db-access.outputs.skip_live != 'true'
        # Detecta funções que chamam rotinas de extensão (pgcrypto, pg_net, ...)
        # sem o schema da extensão no search_path fixado. Esse defeito NÃO é
        # acusado na criação da função — só explode em produção, na primeira
        # gravação selada por hash.
        run: node scripts/audit-db-search-path.mjs
      - name: Smoke test dos selos de integridade
        if: steps.db-access.outputs.skip_live != 'true'
        # Verifica que todo gatilho enforce_*_hash está acoplado, é BEFORE
        # INSERT/UPDATE e consegue resolver digest() sob seu próprio
        # search_path. Não grava dados de negócio.
        run: node scripts/smoke-hash-triggers.mjs
      - name: Regressão de RLS sobre PII
        if: steps.db-access.outputs.skip_live != 'true'
        # Reprova o build quando uma política sobre tabela com dado pessoal
        # (CPF, PIS, salário, conta bancária, endereço, biometria...) não
        # correlaciona com auth.uid() nem com o vínculo de empresa, ou quando
        # deriva o tenant de claim livre do JWT. O Postgres aceita esses
        # predicados sem reclamar — a exposição só aparece em produção.
        run: node scripts/audit-rls-pii.mjs
      - name: Menor privilégio em RLS (papel no caminho de escrita)
        if: steps.db-access.outputs.skip_live != 'true'
        # Complementa o gate acima. Isolar por empresa aprova ali, mas em tabela
        # sensível não basta: com `FOR ALL` + só `empresa_id`, o estagiário e o
        # RH ficam indistinguíveis dentro do mesmo tenant — contracheque, conta
        # bancária, ASO e denúncia do canal de ética ficam graváveis por
        # qualquer autenticado. Escrita nessas tabelas exige papel explícito.
        run: node scripts/audit-rls-least-privilege.mjs
      - name: Política permissiva irrestrita em tabela multi-tenant
        if: steps.db-access.outputs.skip_live != 'true'
        # Políticas PERMISSIVAS se combinam por OU: basta UMA liberar para o
        # acesso ser concedido. `rubricas_folha` já tinha a política correta
        # (catálogo global OU pertence à empresa) e mesmo assim vazava as
        # rubricas de todas as empresas, porque uma legada `USING (true)` nunca
        # foi removida. Escrever a política certa não protege enquanto a errada
        # viver. Os gates acima não pegam o caso: rubrica de folha não é PII.
        run: node scripts/audit-rls-tenant-open.mjs
      - name: Autorização em funções SECURITY DEFINER
        if: steps.db-access.outputs.skip_live != 'true'
        # SECURITY DEFINER atravessa o RLS: se a função é executável por
        # anon/authenticated e confia em identificadores vindos do chamador,
        # ela anula o isolamento multi-tenant sem que nenhuma política esteja
        # errada. O gate segue o fecho transitivo de chamadas para não reprovar
        # funções que delegam a checagem a um helper.
        run: node scripts/audit-secdef-authz.mjs
      - name: Integridade das dicas de relacionamento (PostgREST)
        if: steps.db-access.outputs.skip_live != 'true'
        # `.select('*, tabela!constraint(...)')` amarra o código a um nome de
        # constraint que nada valida: typecheck e testes com mock passam, e a
        # quebra só aparece em runtime como PGRST200. Também reprova FKs
        # duplicadas, que reintroduzem a ambiguidade de relacionamento.
        run: node scripts/audit-embed-hints.mjs
      - name: Resumo da integridade do banco (GITHUB_STEP_SUMMARY)
        if: always()
        run: |
          {
            echo "## db-integrity-live"
            echo "| Script | Status |"
            echo "|--------|--------|"
            echo "| db-integrity-live | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  npm-audit:
    name: npm audit (produção, sem devDeps)
    # W83: gate bloqueante — impede merge se houver vulnerabilidade high/critical
    # em dependências de produção (--omit=dev).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (sem scripts)
        run: npm ci --ignore-scripts
      - name: Audit produção (bloqueante)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit dev deps (informativo)
        # W83: informativo — não quebra o CI, mas mostra vulnerabilidades em devDeps
        # contrato: continue-on-error usado para fins informativos; não oculta vulns prod
        continue-on-error: true
        run: npm audit --audit-level=critical

  dependency-review:
    name: Revisão de dependências (PR)
    # W84: bloqueia PRs que introduzem vulnerabilidades high/critical ou
    # licenças copyleft nas dependências.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4.6.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
