name: E2E Tests (Playwright)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # W61: E2E manual no projeto canônico com seleção de suite e ref.
  workflow_dispatch:
    inputs:
      project:
        description: 'Suite a executar'
        required: false
        default: 'authenticated'
        type: choice
        options: [public, authenticated, authenticated-non-admin, mobile-smoke, all]
      ref:
        description: 'Branch/SHA a testar (vazio = branch atual)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  # E34: cancel-in-progress só em PR — cancelar o run de main ao chegar um push
  # novo esconderia falhas do commit anterior (nunca aparece "main vermelha").
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright-public:
    name: Playwright público (PR)
    # Codex review (P2, PR #238): workflow_dispatch com project=public/all
    # agora realmente roda a suíte pública — antes o input era decorativo.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.project == 'public' || inputs.project == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # URL e publishable key são identificadores públicos do frontend, não
      # credenciais de escrita. Repository variables ficam disponíveis ao PR;
      # as quatro identidades E2E permanecem exclusivamente no job de main.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_FUNCTIONS_BASE: /functions/v1
      E2E_BASE_URL: http://127.0.0.1:4173
      CI: true
      CI_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Codex review (P2, PR #238): dispatch com project=public e um ref
          # customizado testava a branch certa pelo input, mas o checkout
          # deste job ignorava `inputs.ref` e sempre baixava o SHA do evento
          # -- testando silenciosamente a branch errada. Sem secrets neste
          # job, usar qualquer ref é seguro (ao contrário do job autenticado).
          ref: ${{ inputs.ref || github.sha }}

      - name: Validate public E2E configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo '::error::Repository variable VITE_SUPABASE_URL is missing'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo '::error::Repository variable VITE_SUPABASE_PUBLISHABLE_KEY is missing'; exit 1; }
          test "$VITE_SUPABASE_URL" = 'https://frjbfeamybqsejlvmqbl.supabase.co' || { echo '::error::Public E2E target is not canonical'; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Cache Playwright browsers
        id: playwright-public-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-public-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-public-cache.outputs.cache-hit == 'true'
        run: ./node_modules/.bin/playwright install-deps chromium

      - name: Run public Playwright E2E
        run: npm run test:e2e:public

      - name: Upload public Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-public-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  playwright:
    name: Playwright E2E
    # As quatro identidades são sintéticas, mas ainda concedem escrita no
    # projeto canônico. Não expor suas credenciais a código de pull request.
    # O gate autenticado roda no SHA já integrado em main.
    # W65: workflow_dispatch também roda este job (credentials disponíveis).
    # Codex review (P2, PR #238): dispatch com project=public não precisa
    # deste job (sem secrets) — ver playwright-public acima.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.project != 'public')
    runs-on: ubuntu-latest
    # W65: timeout reduzido de 30 para 20 min (suite atual termina em ~12 min).
    # Sharding (matrix: shard [1,2]) foi avaliado mas descartado: auth state
    # (e2e/.auth/user.json, user-mobile.json, user-non-admin.json) é escrito
    # por setup projects e lido por specs dependentes — cada shard teria que
    # rodar setup independentemente e compartilhar os artefatos de auth entre
    # shards (upload/download), o que complica a orquestração sem ganho real
    # num suite de ~12 min. Reavaliar quando o suite ultrapassar 20 min.
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_FUNCTIONS_BASE: /functions/v1
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_NON_ADMIN_EMAIL: ${{ secrets.E2E_NON_ADMIN_EMAIL }}
      E2E_NON_ADMIN_PASSWORD: ${{ secrets.E2E_NON_ADMIN_PASSWORD }}
      MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
      MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
      MAILOSAUR_INBOX_DOMAIN: ${{ secrets.MAILOSAUR_INBOX_DOMAIN }}
      E2E_BASE_URL: http://127.0.0.1:4173
      CI: true
      CI_BRANCH: ${{ github.ref_name }}

    steps:
      # Codex review (P1, PR #238): um ref arbitrário digitado no dispatch
      # rodaria código não revisado com as 4 credenciais de escrita do
      # canônico. Só 'main' ou vazio (default = SHA do evento, sempre main
      # neste job) são aceitos -- validado ANTES do checkout, então nada do
      # ref rejeitado chega a ser baixado. Para testar branch não mergeada,
      # usar a suíte pública (sem secrets).
      #
      # Codex review (P1, PR #238, 2ª rodada): a checagem original só olhava
      # `inputs.ref` (o campo de texto customizado). Quem disparasse o
      # workflow_dispatch pelo seletor de branch NATIVO do GitHub (não pelo
      # input de texto) escolhia uma branch não-main em `github.ref` e deixava
      # `inputs.ref` vazio -- o guard antigo não disparava (inputs.ref == '')
      # e o checkout abaixo usaria `github.sha` dessa branch arbitrária com as
      # credenciais de escrita. Agora também exigimos `github.ref ==
      # 'refs/heads/main'`, cobrindo os dois vetores (seletor nativo e input).
      - name: Validar ref de dispatch (restrito a main)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (github.ref != 'refs/heads/main' || (inputs.ref != '' && inputs.ref != 'main'))
        env:
          REF_INPUT: ${{ inputs.ref }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          echo "::error::Dispatch restrito a main: github.ref='${DISPATCH_REF}' (deve ser refs/heads/main, independente do seletor de branch usado) e ref='${REF_INPUT}' (deve ser 'main' ou vazio). Credenciais de escrita do canônico não podem rodar código de outra branch. Use a suíte pública (project=public) para branches não mergeadas."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # W61: usa o ref do input quando dispatch manual, senão usa o ref padrão do evento
          ref: ${{ inputs.ref || github.sha }}

      - name: Validate E2E configuration
        run: |
          missing=()
          for name in \
            VITE_SUPABASE_URL \
            VITE_SUPABASE_PUBLISHABLE_KEY \
            E2E_USER_EMAIL \
            E2E_USER_PASSWORD \
            E2E_NON_ADMIN_EMAIL \
            E2E_NON_ADMIN_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Required E2E configuration is missing: %s\n' "${missing[*]}"
            exit 1
          fi
          test "$VITE_SUPABASE_URL" = 'https://frjbfeamybqsejlvmqbl.supabase.co' || { echo '::error::Authenticated E2E target is not canonical'; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Cache dos binários do Chromium (~90% redução no download)
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # Se o browser estava em cache, ainda precisa instalar as libs de sistema
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: ./node_modules/.bin/playwright install-deps chromium

      - name: Run Playwright E2E
        # Codex review (P2, PR #238): project input agora seleciona o
        # projeto de verdade em dispatch; push na main continua rodando a
        # suíte completa (PROJECT_INPUT vazio nesse evento).
        env:
          PROJECT_INPUT: ${{ inputs.project }}
        run: |
          if [ -n "${PROJECT_INPUT}" ] && [ "${PROJECT_INPUT}" != "all" ]; then
            ./node_modules/.bin/playwright test --project="${PROJECT_INPUT}"
          else
            npm run test:e2e
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload traces on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-traces-${{ github.run_id }}
          path: test-results/**/trace.zip
          retention-days: 14

      # E49/E80: falha de E2E autenticado na main abre/atualiza issue com label
      # `e2e-main` (deduplicada) e a fecha automaticamente ao voltar a verde —
      # antes, runs vermelhos em série passavam sem ninguém ser avisado (D5).
      - name: Abrir issue em caso de falha na main
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🔴 E2E autenticado falhou na main ($(date -u +%F\ %H:%M) UTC)"
          EXISTING=$(gh issue list --label e2e-main --state open --json number --jq '.[0].number' || true)
          BODY=$(printf 'O E2E autenticado falhou em push na main.\n\nRun: %s/%s/actions/runs/%s\n\nVerificar runbook: infra/runbooks/RESPOSTA_INCIDENTES.md' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh label create e2e-main --force >/dev/null 2>&1 || true
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label e2e-main
          fi

      - name: Fechar issue ao recuperar
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label e2e-main --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "E2E autenticado voltou ao verde. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
