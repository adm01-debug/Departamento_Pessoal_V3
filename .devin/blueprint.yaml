# https://docs.devin.ai/onboard-devin/environment-yaml
# engines: node 22.x + .npmrc engine-strict; bun.lock está desatualizado — use npm, não bun.
initialize: |
  export NVM_DIR="$HOME/.nvm"
  . "$NVM_DIR/nvm.sh"
  nvm install 22
  # actionlint é exigido pelo lint-staged em commits que tocam .github/workflows
  mkdir -p "$HOME/.local/bin"
  curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.8/actionlint_1.7.8_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
  tar -xzf /tmp/actionlint.tgz -C "$HOME/.local/bin" actionlint
  rm /tmp/actionlint.tgz
  echo "PATH=$HOME/.local/bin:$PATH" >> "$ENVRC"
maintenance: |
  export NVM_DIR="$HOME/.nvm"
  . "$NVM_DIR/nvm.sh"
  nvm use 22
  npm install
