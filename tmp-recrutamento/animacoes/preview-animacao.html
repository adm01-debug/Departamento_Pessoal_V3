<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        background: #0b1220;
        color: #e5e7eb;
        font: 600 12px/1.2 system-ui, sans-serif;
        padding: 8px;
      }
      .linha { display: grid; grid-template-columns: 46px 1fr 1fr; gap: 8px; margin-bottom: 8px; }
      .tempo { padding-top: 18px; color: #9ca3af; }
      figure { margin: 0; }
      figcaption { padding: 1px 0 4px; color: #cbd5e1; }
      img { display: block; width: 100%; border: 1px solid #22304a; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="linha">
      <div class="tempo">t0</div>
      <figure><figcaption>ADMISSÃO</figcaption><img src="admissao-t0.jpg" /></figure>
      <figure><figcaption>RECRUTAMENTO</figcaption><img src="recrutamento-t0.jpg" /></figure>
    </div>
    <div class="linha">
      <div class="tempo">+1,1s</div>
      <figure><figcaption>ADMISSÃO</figcaption><img src="admissao-t2.jpg" /></figure>
      <figure><figcaption>RECRUTAMENTO</figcaption><img src="recrutamento-t2.jpg" /></figure>
    </div>
    <div class="linha">
      <div class="tempo">final</div>
      <figure><figcaption>ADMISSÃO</figcaption><img src="admissao-final.jpg" /></figure>
      <figure><figcaption>RECRUTAMENTO</figcaption><img src="recrutamento-final.jpg" /></figure>
    </div>
  </body>
</html>
